  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #24292e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Top bar ===== */
    .topbar {
      background: #24292e;
      color: #fff;
      padding: 0 20px;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 200;
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
    }

    .topbar .spacer { flex: 1; }

    #overall-progress {
      font-size: 13px;
      color: #8b949e;
      white-space: nowrap;
    }

    #overall-progress.has-progress { color: #58a6ff; }

    /* ===== Auto-save failure warning (issue #60) ===== */
    .autosave-warning-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 20px;
      background: #7d4e00;
      color: #fff;
      font-size: 13px;
      flex-shrink: 0;
      position: sticky;
      top: 50px;
      z-index: 190;
    }

    #autosave-warning-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .view-mode-toggle {
      display: flex;
      border: 1px solid #444c56;
      border-radius: 6px;
      overflow: hidden;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .view-mode-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: #2d333b;
      color: #adbac7;
      cursor: pointer;
      white-space: nowrap;
    }

    .view-mode-btn + .view-mode-btn { border-left: 1px solid #444c56; }
    .view-mode-btn:hover:not(.active) { background: #373e47; }
    .view-mode-btn.active { background: #58a6ff; color: #0b1116; }

    .filter-checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #c9d1d9;
      user-select: none;
      white-space: nowrap;
    }

    .filter-checkbox-group-label {
      white-space: nowrap;
    }

    .filter-checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .memo-toggle-btn, .settings-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #2d333b;
      color: #adbac7;
      border: 1px solid #444c56;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .memo-toggle-btn:hover, .settings-toggle-btn:hover { background: #373e47; }
    .memo-toggle-btn[aria-expanded="true"], .settings-toggle-btn[aria-expanded="true"] { background: #58a6ff; color: #0b1116; }

    .memo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #da3633;
      color: #fff;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .memo-badge[hidden] { display: none; }

    /* ===== Layout ===== */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 50px - var(--autosave-warning-height, 0px));
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 280px;
      min-width: 220px;
      background: #fff;
      border-right: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .load-section {
      padding: 14px 16px;
      border-bottom: 1px solid #e1e4e8;
    }

    .load-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px 14px;
      background: #0969da;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .load-btn:hover { background: #0550ae; }

    #file-input { display: none; }

    .io-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .io-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      background: #f6f8fa;
      color: #24292e;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .io-btn:hover { background: #e7eaef; }

    #import-input { display: none; }

    .folder-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 11px;
      color: #57606a;
    }

    .folder-label { flex-shrink: 0; }

    .folder-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #24292e;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }

    .folder-btn {
      flex-shrink: 0;
      padding: 3px 8px;
      background: #f6f8fa;
      color: #24292e;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .folder-btn:hover { background: #e7eaef; }

    .settings-save-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e1e4e8;
    }

    .settings-save-section .folder-row { margin-top: 0; }

    .settings-save-btn { width: 100%; margin-top: 8px; }

    .folder-status-msg {
      margin-top: 6px;
      font-size: 11px;
      color: #57606a;
      min-height: 14px;
    }

    .folder-external-update-msg {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #9a6700;
    }

    .encoding-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      color: #57606a;
    }

    .encoding-row label { flex-shrink: 0; }

    .encoding-row select,
    .proj-encoding select {
      flex: 1;
      min-width: 0;
      padding: 3px 4px;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      background: #fff;
      color: #24292e;
      font-size: 11px;
    }

    .sort-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 12px;
      color: #57606a;
      border-bottom: 1px solid #e1e4e8;
    }

    .sort-row label { flex-shrink: 0; }

    .sort-row select {
      flex: 1;
      min-width: 0;
      padding: 3px 4px;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      background: #fff;
      color: #24292e;
      font-size: 11px;
    }

    .keyword-row {
      margin-top: 10px;
      font-size: 12px;
      color: #57606a;
    }

    .keyword-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .keyword-category-add-btn {
      flex-shrink: 0;
      padding: 2px 8px;
      background: none;
      border: 1px solid #0969da;
      border-radius: 5px;
      color: #0969da;
      font-size: 11px;
      cursor: pointer;
    }

    .keyword-category-add-btn:hover { background: #ddf4ff; }

    .keyword-categories {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .keyword-categories-empty {
      font-size: 11px;
      color: #8b949e;
      padding: 4px 0;
    }

    .keyword-category-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .keyword-category-main {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .keyword-category-count-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 32px;
      font-size: 11px;
      color: #57606a;
      cursor: pointer;
      user-select: none;
    }

    .keyword-category-count-toggle { cursor: pointer; }

    .keyword-category-count-badge {
      font-weight: 600;
      color: #24292e;
    }

    .keyword-category-color {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }

    .keyword-category-keywords {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      padding: 5px 6px;
      border: 1px solid #d0d7de;
      border-radius: 5px;
      background: #fff;
      color: #24292e;
      font-size: 12px;
    }

    .keyword-category-keywords:focus {
      outline: none;
      border-color: #0969da;
    }

    .keyword-category-remove-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .keyword-category-remove-btn:hover { background: #ffeef0; color: #cf222e; }

    .sidebar-section-title {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid #e1e4e8;
      background: #f6f8fa;
    }

    .project-list {
      flex: 1;
      overflow-y: auto;
    }

    .project-empty {
      padding: 20px 16px;
      color: #8b949e;
      font-size: 13px;
      text-align: center;
    }

    .project-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #f0f2f5;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }

    .project-item:hover { background: #f6f8fa; }

    .project-item.active {
      background: #ddf4ff;
      border-left-color: #0969da;
    }

    .proj-name {
      font-size: 13px;
      font-weight: 600;
      color: #24292e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .proj-id {
      font-size: 10px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'SFMono-Regular', Consolas, monospace;
      margin-bottom: 4px;
    }

    .proj-meta {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .proj-encoding {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .proj-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      background: none;
    }

    .btn-reset {
      color: #953800;
      border-color: #f0a76c;
      background: #fff8f0;
    }
    .btn-reset:hover { background: #ffe8cc; }

    .btn-delete {
      color: #57606a;
      border-color: #d0d7de;
      background: #fff;
    }
    .btn-delete:hover { background: #f6f8fa; }

    .btn-reload {
      color: #0a5c36;
      border-color: #7ee2a8;
      background: #eafff2;
    }
    .btn-reload:hover { background: #ccffdf; }

    /* ===== Main content ===== */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .empty-state {
      text-align: center;
      color: #8b949e;
      margin-top: 80px;
      font-size: 15px;
      line-height: 2;
    }

    .empty-state .icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    /* ===== Stat summary panel ===== */
    .stat-summary {
      margin-bottom: 20px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .stat-summary-header {
      padding: 8px 16px;
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      font-size: 12px;
      font-weight: 700;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 16px;
      border-bottom: 1px solid #f0f2f5;
      font-size: 12px;
    }

    .stat-row:last-child { border-bottom: none; }

    .stat-row.stat-total {
      background: #f6f8fa;
      border-top: 1px solid #d0d7de;
      font-weight: 600;
      font-size: 12px;
      color: #24292e;
    }

    .stat-filename {
      font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
      color: #0969da;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
      text-decoration: none;
    }

    .stat-filename:hover { text-decoration: underline; }

    .stat-counts {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
    }

    .stat-add { color: #1a7f37; }
    .stat-del { color: #cf222e; }

    .stat-bar {
      display: flex;
      gap: 1px;
      flex-shrink: 0;
    }

    .stat-bar-add {
      display: inline-block;
      width: 8px;
      height: 10px;
      background: #2da44e;
      border-radius: 1px;
    }

    .stat-bar-del {
      display: inline-block;
      width: 8px;
      height: 10px;
      background: #cf222e;
      border-radius: 1px;
    }

    /* ===== File sections ===== */
    .file-section {
      margin-bottom: 28px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      background: #fff;
      overflow: hidden;
    }

    .file-header {
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .file-path {
      font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #24292e;
      word-break: break-all;
    }

    .file-progress {
      font-size: 12px;
      color: #57606a;
      background: #e1e4e8;
      padding: 2px 10px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }

    .file-progress.complete {
      background: #d4edda;
      color: #155724;
    }

    /* ===== Hunk cards ===== */
    .hunk-card {
      border-top: 1px solid #e1e4e8;
      transition: background 0.15s;
    }

    .hunk-card:first-of-type { border-top: none; }

    /* Review status (issue #51): each status gets its own card tint so the
       three outcomes stay visually distinct from each other and from the
       neutral (unreviewed) state. */
    .hunk-card.status-approved      { background: #f0fff4; }
    .hunk-card.status-needs_changes { background: #fff5f5; }
    .hunk-card.status-on_hold       { background: #fffdf0; }

    .hunk-card.focused {
      outline: 2px solid #4c9aff;
      outline-offset: -2px;
    }

    .hunk-card.focused .hunk-header-bar {
      background: #dceaff;
    }

    .hunk-card.focused.status-approved .hunk-header-bar      { background: #d3f5df; }
    .hunk-card.focused.status-needs_changes .hunk-header-bar { background: #ffd9d9; }
    .hunk-card.focused.status-on_hold .hunk-header-bar       { background: #fdf3c4; }

    .hunk-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: #f1f8ff;
      border-bottom: 1px solid #dbe9fd;
      gap: 10px;
      cursor: pointer;
    }

    .hunk-card.status-approved .hunk-header-bar {
      background: #e6ffed;
      border-bottom-color: #c3e6cb;
    }

    .hunk-card.status-needs_changes .hunk-header-bar {
      background: #ffeef0;
      border-bottom-color: #f5c6cb;
    }

    .hunk-card.status-on_hold .hunk-header-bar {
      background: #fff8e1;
      border-bottom-color: #f0e2a6;
    }

    .hunk-card.collapsed .hunk-header-bar {
      border-bottom: none;
    }

    .hunk-body {
      overflow: hidden;
    }

    .hunk-card.collapsed .hunk-body {
      display: none;
    }

    .hunk-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 2px;
      color: #57606a;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .hunk-toggle-btn:hover { color: #24292e; }

    .hunk-header-text {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      color: #0550ae;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .review-status-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .review-status-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: #fff;
      color: #57606a;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .review-status-btn:hover { background: #f6f8fa; }

    .review-status-btn.status-approved.active {
      background: #1a7f37;
      border-color: #1a7f37;
      color: #fff;
    }

    .review-status-btn.status-needs_changes.active {
      background: #cf222e;
      border-color: #cf222e;
      color: #fff;
    }

    .review-status-btn.status-on_hold.active {
      background: #9a6700;
      border-color: #9a6700;
      color: #fff;
    }

    /* ===== Diff table ===== */
    .diff-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
      font-size: 12px;
      table-layout: fixed;
    }

    .diff-table tbody tr { line-height: 20px; }

    .line-num {
      width: 50px;
      text-align: right;
      padding: 0 8px;
      color: #8b949e;
      border-right: 1px solid #e1e4e8;
      user-select: none;
      vertical-align: top;
      white-space: nowrap;
    }

    .line-content {
      padding: 0 8px;
      white-space: pre;
      overflow-x: hidden;
      vertical-align: top;
    }

    /* Prevent highlight.js from overriding diff row background colors */
    .diff-table td .hljs,
    .diff-table .hljs-code,
    .diff-table .hljs-addition,
    .diff-table .hljs-deletion { background: transparent; padding: 0; }

    /* Keyword highlight (issue #10): applied on top of syntax highlighting,
       so it must win over the transparent background rules above. Background
       and text color are set inline per match (see applyKeywordHighlight),
       reflecting that match's category color; the values below are only a
       fallback. */
    .keyword-hit {
      background: #fff000;
      color: #24292e;
      border-radius: 2px;
    }

    .line-prefix {
      display: inline-block;
      width: 14px;
    }

    .line-add { background: #e6ffec; }
    .line-add .line-num { background: #ccffd8; }
    .line-add .line-prefix { color: #1a7f37; font-weight: bold; }

    .line-del { background: #ffebe9; }
    .line-del .line-num { background: #ffd7d5; }
    .line-del .line-prefix { color: #cf222e; font-weight: bold; }

    /* Split (side-by-side) view applies .line-add/.line-del directly to the
       .line-num cell itself rather than to an ancestor <tr>, so the above
       descendant rules don't match there — add same-element equivalents. */
    td.line-num.line-add { background: #ccffd8; }
    td.line-num.line-del { background: #ffd7d5; }

    .line-context { background: #fff; }
    .line-context .line-prefix { color: #8b949e; }

    .line-no-newline {
      background: #fffce0;
      font-style: italic;
      color: #8b949e;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      padding: 2px 8px;
    }

    /* ===== Diff table: side-by-side (split) mode ===== */
    .diff-table-split .col-divider { border-left: 2px solid #d0d7de; }

    .diff-table-split thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #57606a;
      background: #f6f8fa;
      padding: 4px 8px;
      border-bottom: 1px solid #e1e4e8;
    }

    .diff-table-split thead th.col-divider { border-left: 2px solid #d0d7de; }

    .line-empty { background: #f6f8fa; }
    .line-empty.line-num { color: transparent; }

    /* ===== Drag & drop overlay ===== */
    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 105, 218, 0.10);
      border: 4px dashed #0969da;
      z-index: 400;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .drop-overlay.active { display: flex; }

    .drop-overlay-msg {
      padding: 16px 28px;
      background: #fff;
      border: 1px solid #0969da;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      font-size: 16px;
      font-weight: 600;
      color: #0969da;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      max-width: 500px;
      width: 92%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #24292e;
    }

    .modal-desc {
      font-size: 14px;
      color: #57606a;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .modal-proj-list {
      margin-bottom: 20px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow: hidden;
      max-height: 220px;
      overflow-y: auto;
    }

    .proj-option {
      padding: 9px 12px;
      font-size: 13px;
      border-bottom: 1px solid #e1e4e8;
      cursor: pointer;
      transition: background 0.1s;
    }

    .proj-option:last-child { border-bottom: none; }
    .proj-option:hover { background: #f6f8fa; }
    .proj-option.selected { background: #ddf4ff; }

    .proj-option .opt-id {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      color: #24292e;
      font-weight: 600;
    }

    .proj-option .opt-meta {
      font-size: 11px;
      color: #8b949e;
      margin-top: 2px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .modal-btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .modal-btn-primary {
      background: #0969da;
      color: #fff;
      border-color: #0969da;
    }
    .modal-btn-primary:hover { background: #0550ae; }

    .modal-btn-secondary {
      background: #f6f8fa;
      color: #24292e;
      border-color: #d0d7de;
    }
    .modal-btn-secondary:hover { background: #e7eaef; }

    /* ===== Settings modal (issue #61) ===== */
    .settings-modal {
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .settings-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }

    .settings-modal-header h2 { margin-bottom: 0; }

    .settings-modal-close {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 16px;
      color: #57606a;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .settings-modal-close:hover { background: #f0f2f5; color: #24292e; }

    .settings-modal-body {
      overflow-y: auto;
      padding: 0 24px 24px;
    }

    /* ===== Review memo panel =====
       z-index stays below .drop-overlay (400) so the drag & drop guide is
       never hidden behind the panel while it's open. */
    .memo-panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 380;
    }

    .memo-panel-overlay.active { display: block; }

    .memo-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 340px;
      min-width: 280px;
      max-width: 90vw;
      background: #fff;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.2);
      z-index: 390;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(100%);
      /* visibility is a discrete property: transitioning to 'visible' flips
         immediately, transitioning to 'hidden' flips only once the slide-out
         finishes — so closed-but-offscreen content can't be Tab-focused
         (aria-hidden alone doesn't block keyboard focus). */
      visibility: hidden;
      transition: transform 0.2s ease, visibility 0.2s ease;
    }

    .memo-panel.open { transform: translateX(0); visibility: visible; }

    .memo-panel-resizer {
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 100%;
      cursor: ew-resize;
      touch-action: none;
      z-index: 1;
    }

    .memo-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #e1e4e8;
      flex-shrink: 0;
    }

    .memo-panel-header h2 { font-size: 15px; font-weight: 700; color: #24292e; }

    .memo-panel-close {
      background: none;
      border: none;
      font-size: 16px;
      color: #57606a;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .memo-panel-close:hover { background: #f0f2f5; color: #24292e; }

    .memo-add-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e1e4e8;
      flex-shrink: 0;
    }

    .memo-add-form textarea {
      width: 100%;
      min-height: 88px;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      font-family: inherit;
      resize: vertical;
    }

    .memo-add-btn {
      align-self: flex-end;
      padding: 6px 14px;
      background: #0969da;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .memo-add-btn:hover { background: #0550ae; }
    .memo-add-form textarea:disabled,
    .memo-add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .memo-empty {
      padding: 24px 16px;
      text-align: center;
      font-size: 13px;
      color: #8b949e;
    }

    .memo-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .memo-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #f0f2f5;
    }

    .memo-item label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex: 1;
      min-width: 0;
      font-size: 13px;
      color: #24292e;
      cursor: pointer;
    }

    .memo-item input[type="checkbox"] {
      margin-top: 2px;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #1a7f37;
    }

    .memo-item .memo-text {
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .memo-item.done .memo-text {
      text-decoration: line-through;
      color: #8b949e;
    }

    .memo-item-delete {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .memo-item-delete:hover { background: #ffeef0; color: #cf222e; }

    .memo-list-divider {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      background: #f6f8fa;
    }

    /* ===== Wide-viewport memo panel docking (issue #57) =====
       On viewports at least 1200px wide there's enough room to keep the memo
       panel permanently visible as a third flex column inside .layout instead
       of a slide-in overlay. Keep this breakpoint in sync with
       WIDE_LAYOUT_MEDIA_QUERY in the script below. */
    @media (min-width: 1200px) {
      .memo-panel-overlay { display: none !important; }

      .memo-toggle-btn { display: none; }

      .memo-panel {
        /* relative (not static) so it stays the containing block for the
           absolutely-positioned .memo-panel-resizer handle. */
        position: relative;
        transform: none !important;
        visibility: visible !important;
        box-shadow: none;
        border-left: 1px solid #d0d7de;
        flex-shrink: 0;
      }

      .memo-panel-close { display: none; }
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d7de; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>🔍 Git Local Review</h1>
  <div class="spacer"></div>
  <div class="view-mode-toggle" id="view-mode-toggle" role="group" aria-label="差分の表示切り替え">
    <button type="button" class="view-mode-btn" id="view-mode-unified" data-mode="unified" aria-pressed="true">Unified</button>
    <button type="button" class="view-mode-btn" id="view-mode-split" data-mode="split" aria-pressed="false">左右表示</button>
  </div>
  <div class="filter-checkbox-group" id="review-filter-group" role="group" aria-label="表示するハンクをレビュー状態で絞り込みます">
    <span class="filter-checkbox-group-label">表示:</span>
    <label class="filter-checkbox-label"><input type="checkbox" id="review-filter-unreviewed">未レビュー</label>
    <label class="filter-checkbox-label"><input type="checkbox" id="review-filter-approved">承認</label>
    <label class="filter-checkbox-label"><input type="checkbox" id="review-filter-needs_changes">要修正</label>
    <label class="filter-checkbox-label"><input type="checkbox" id="review-filter-on_hold">保留</label>
  </div>
  <button type="button" class="settings-toggle-btn" id="settings-modal-open-btn" title="設定" aria-haspopup="dialog" aria-controls="settings-modal-overlay" aria-expanded="false">
    <span aria-hidden="true">⚙️</span> 設定
  </button>
  <button type="button" class="memo-toggle-btn" id="memo-toggle-btn" title="レビューメモ" aria-expanded="false" aria-controls="memo-panel">
    <span aria-hidden="true">📝</span> メモ<span class="memo-badge" id="memo-badge" hidden>0</span>
  </button>
  <span id="overall-progress"></span>
</div>

<!-- Auto-save failure warning (issue #60): shown only while a settings
     auto-save folder is configured AND the last save attempt (or a
     proactive permission check) failed. Not shown for "no folder
     configured" or for the external-change notice, which already has its
     own dedicated sidebar notice/action. -->
<div class="autosave-warning-banner" id="autosave-warning-banner" role="alert" style="display:none;">
  <span aria-hidden="true">⚠️</span>
  <span id="autosave-warning-text">保存先フォルダへの自動保存に失敗しています。</span>
</div>

<!-- Main layout -->
<div class="layout">

  <!-- Sidebar: file loader + project list -->
  <div class="sidebar">
    <div class="load-section">
      <input type="file" id="file-input" accept=".diff,.patch,.txt,text/plain" multiple>
      <button class="load-btn" id="load-btn">
        <span aria-hidden="true">📂</span> Diffファイルを開く
      </button>
      <div class="io-btn-row">
        <input type="file" id="import-input" accept="application/json,.json">
        <button class="io-btn" id="export-btn" title="プロジェクトとレビュー状態をJSONファイルに保存">
          <span aria-hidden="true">💾</span> エクスポート
        </button>
        <button class="io-btn" id="import-btn" title="エクスポートしたJSONファイルから復元">
          <span aria-hidden="true">📥</span> インポート
        </button>
      </div>
    </div>
    <div class="sidebar-section-title">プロジェクト一覧</div>
    <div class="sort-row">
      <label for="project-sort-select">並び順</label>
      <select id="project-sort-select" title="プロジェクト一覧の並び順">
        <option value="updated-desc">更新日（新しい順）</option>
        <option value="updated-asc">更新日（古い順）</option>
        <option value="name-asc">ファイル名（A→Z）</option>
        <option value="name-desc">ファイル名（Z→A）</option>
      </select>
    </div>
    <div class="project-list" id="project-list"></div>
  </div>

  <!-- Diff view -->
  <div class="main">
    <div class="empty-state" id="empty-state">
      <span class="icon" aria-hidden="true">📄</span>
      Diffファイルを読み込んでください
    </div>
    <div id="stat-summary" style="display:none;"></div>
    <div id="diff-container"></div>
  </div>

  <!-- Review memo panel: per-project checklist notes, unrelated to any specific
       file/hunk. Lives inside .layout (rather than as a page-level overlay) so
       that on wide viewports (see WIDE_LAYOUT_MEDIA_QUERY) it can dock as a
       permanently visible third flex column instead of a slide-in overlay. -->
  <div class="memo-panel-overlay" id="memo-panel-overlay"></div>
  <aside class="memo-panel" id="memo-panel" aria-hidden="true" aria-label="レビューメモ">
    <div class="memo-panel-resizer" id="memo-panel-resizer" aria-hidden="true"></div>
    <div class="memo-panel-header">
      <h2>📝 レビューメモ</h2>
      <button type="button" class="memo-panel-close" id="memo-panel-close" aria-label="閉じる">✕</button>
    </div>
    <form class="memo-add-form" id="memo-add-form">
      <textarea id="memo-input" placeholder="メモを追加（Ctrl+Enterで追加）" maxlength="5000"></textarea>
      <button type="submit" class="memo-add-btn">追加</button>
    </form>
    <div class="memo-empty" id="memo-empty" style="display:none;"></div>
    <ul class="memo-list" id="memo-list"></ul>
  </aside>

</div>

<!-- Drag & drop overlay, shown while a file is being dragged over the window -->
<div class="drop-overlay" id="drop-overlay" aria-hidden="true">
  <div class="drop-overlay-msg">
    <span aria-hidden="true">📥</span> ここに diff ファイルをドロップして読み込む
  </div>
</div>

<!-- Conflict modal (same filename loaded again) -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">📁 既存プロジェクトが見つかりました</h2>
    <p class="modal-desc" id="modal-desc"></p>
    <div class="modal-proj-list" id="modal-proj-list"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-secondary" id="modal-btn-new">新規プロジェクトとして作成</button>

<!-- Settings modal (issue #61): consolidates settings previously scattered
     across the sidebar — default open folder, settings auto-save folder,
     encoding detection, and keyword categories — behind a single "⚙️ 設定"
     button, opened/closed independently of the conflict modal above. -->
<div class="modal-overlay" id="settings-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
  <div class="modal settings-modal">
    <div class="settings-modal-header">
      <h2 id="settings-modal-title">⚙️ 設定</h2>

        <span class="folder-name" id="open-folder-name">未設定</span>
        <button type="button" class="folder-btn" id="open-folder-set-btn" title="Diffファイルを開く際の既定のフォルダを設定">選択</button>
        <button type="button" class="folder-btn" id="open-folder-clear-btn" title="既定のフォルダ設定を解除">解除</button>
      </div>
      <div class="settings-save-section" id="settings-save-section">
        <div class="folder-row" id="settings-folder-row">
          <span class="folder-label">保存先フォルダ:</span>
          <span class="folder-name" id="settings-folder-name">未設定</span>
          <button type="button" class="folder-btn" id="settings-folder-set-btn" title="設定の保存先フォルダを選択">選択</button>
          <button type="button" class="folder-btn" id="settings-folder-clear-btn" title="保存先フォルダの設定を解除">解除</button>
        </div>
        <button class="io-btn settings-save-btn" id="settings-save-btn" title="今すぐ指定フォルダに保存します（変更時は自動でも保存されます）">
          <span aria-hidden="true">💾</span> 設定を保存
        </button>
        <div class="folder-status-msg" id="settings-save-status"></div>
        <div class="folder-status-msg folder-external-update-msg" id="settings-external-update-notice" style="display:none;">
          ⚠️ 保存先フォルダのデータが他の環境で更新されています。
          <button type="button" class="folder-btn" id="settings-reload-btn">読み込む</button>
        </div>
      </div>
      <div class="encoding-row">
        <label for="encoding-select">文字コード</label>
        <select id="encoding-select" title="読み込むdiffファイルの文字コード">
          <option value="auto">自動判定</option>
          <option value="utf-8">UTF-8</option>
          <option value="shift_jis">Shift_JIS</option>
          <option value="euc-jp">EUC-JP</option>
        </select>
      </div>
      <div class="keyword-row">
        <div class="keyword-row-header">
          <label>キーワード（カテゴリ別）</label>
          <button type="button" id="keyword-category-add-btn" class="keyword-category-add-btn" title="カテゴリを追加">+ カテゴリ</button>
        </div>
        <div id="keyword-categories" class="keyword-categories"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// Storage keys
// ─────────────────────────────────────────────────────────────────────────────
const SK_PROJECTS         = 'gitLocalReview_projects';
const SK_REVIEWS          = 'gitLocalReview_reviews';
const SK_MEMOS            = 'gitLocalReview_memos';
const SK_CURRENT          = 'gitLocalReview_currentProject';
const SK_FILES            = 'gitLocalReview_files';
const SK_VIEW_MODE        = 'gitLocalReview_viewMode';
const SK_REVIEW_FILTER    = 'gitLocalReview_reviewFilter';
/** Pre-#51 boolean-only "未レビューのみ表示" toggle, read once for migration into SK_REVIEW_FILTER. */
const SK_UNREVIEWED_ONLY_LEGACY = 'gitLocalReview_unreviewedOnly';
const SK_PROJECT_SORT     = 'gitLocalReview_projectSort';
const SK_KEYWORDS         = 'gitLocalReview_keywords';

const VALID_PROJECT_SORTS = ['updated-desc', 'updated-asc', 'name-asc', 'name-desc'];
const DEFAULT_PROJECT_SORT = 'updated-desc';

/**
 * Hunk review statuses (issue #51). A hunk's stored value in `reviews` is one
 * of these strings, or absent entirely for "unreviewed". Order here also
 * defines the Space-key cycle order and the number-key shortcuts (1/2/3).
 */
const REVIEW_STATUSES = [
  { value: 'approved',      label: '承認',   icon: '✓', key: '1' },
  { value: 'needs_changes', label: '要修正', icon: '✎', key: '2' },
  { value: 'on_hold',       label: '保留',   icon: '⏸', key: '3' },
];
const VALID_REVIEW_STATUS_VALUES = REVIEW_STATUSES.map(s => s.value);

/**
 * Review-filter checkbox keys shown in the top bar (issue #56). 'unreviewed'
 * represents hunks with no stored status; the rest match REVIEW_STATUSES'
 * values. app.reviewFilter is a { [key]: boolean } map — a hunk is shown
 * when the key matching its status is true (OR across all checked keys).
 */
const REVIEW_FILTER_KEYS = ['unreviewed', ...VALID_REVIEW_STATUS_VALUES];

/** All review-filter checkboxes checked = no filtering applied. */
function defaultReviewFilter() {
  const filter = Object.create(null);
  for (const key of REVIEW_FILTER_KEYS) filter[key] = true;
  return filter;
}

/**
 * Whether the review filter is actually narrowing what's shown. All checkboxes
 * checked (nothing to exclude) and all checkboxes unchecked (nothing selected,
 * so there's no meaningful filter to apply) both mean "show everything" per #56.
 */
function isReviewFilterActive(filter) {
  const checkedCount = REVIEW_FILTER_KEYS.filter(key => filter[key]).length;
  return checkedCount !== 0 && checkedCount !== REVIEW_FILTER_KEYS.length;
}

// ─────────────────────────────────────────────────────────────────────────────
// Application state
// ─────────────────────────────────────────────────────────────────────────────
const app = {
  /** @type {string|null} Active project ID */
  currentProjectId: null,
  /** @type {Array<{filePath:string, hunks:Array<{header:string,lines:string[],hash:string}>}>|null} */
  parsedDiff: null,
  /** Holds progress badge elements keyed by filePath, populated during renderDiff */
  fileProgressEls: new Map(),
  /** @type {'unified'|'split'} Current diff view mode ('split' = side-by-side) */
  viewMode: 'unified',
  /** @type {{[key: string]: boolean}} Which review-status hunks renderDiff() shows, keyed by REVIEW_FILTER_KEYS; see loadReviewFilter() */
  reviewFilter: loadReviewFilter(),
  /** Index into the flat, document-order list of currently rendered hunk cards
   *  that has keyboard focus (j/k to move, Space to cycle its review status). -1 = none. */
  focusedHunkIndex: -1,
};

/**
 * Read the diff-list review filter checkboxes from localStorage (defaults to
 * all keys checked, i.e. no filtering). Migrates two older formats on first
 * read, writing the migrated value back to SK_REVIEW_FILTER so migration
 * only needs to run once, not on every page load:
 *  - pre-#56 single-select string ('all' | 'unreviewed' | 'needs_changes')
 *  - pre-#51 boolean-only "未レビューのみ表示" toggle (SK_UNREVIEWED_ONLY_LEGACY)
 */
function loadReviewFilter() {
  try {
    const raw = localStorage.getItem(SK_REVIEW_FILTER);
    if (raw === 'all' || raw === 'unreviewed' || raw === 'needs_changes') {
      const migrated = defaultReviewFilter();
      if (raw !== 'all') {
        for (const key of REVIEW_FILTER_KEYS) migrated[key] = (key === raw);
      }
      saveReviewFilter(migrated);
      return migrated;
    }
    if (raw !== null) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        const filter = defaultReviewFilter();
        for (const key of REVIEW_FILTER_KEYS) {
          if (typeof parsed[key] === 'boolean') filter[key] = parsed[key];
        }
        return filter;
      }
    }
  } catch (e) {
    console.error('Failed to load review filter preference:', e);
    return defaultReviewFilter();
  }

  try {
    if (localStorage.getItem(SK_UNREVIEWED_ONLY_LEGACY) === '1') {
      const migrated = defaultReviewFilter();
      for (const key of REVIEW_FILTER_KEYS) migrated[key] = (key === 'unreviewed');
      saveReviewFilter(migrated);
      localStorage.removeItem(SK_UNREVIEWED_ONLY_LEGACY);
      return migrated;
    }
  } catch (e) {
    console.error('Failed to migrate legacy review filter preference:', e);
  }
  return defaultReviewFilter();
}

/** Persist the diff-list review filter checkboxes. */
function saveReviewFilter(filter) {
  try {
    localStorage.setItem(SK_REVIEW_FILTER, JSON.stringify(filter));
  } catch (e) {
    console.error('Failed to save review filter preference:', e);
  }
}

// Modal transient state
let modalFileName    = '';
let modalParsedDiff  = null;
let modalRawText     = null;
let modalSelectedId  = null;
let modalFileHandle  = null;
let modalEncoding    = 'auto';
let modalResolvedEncoding = 'utf-8';
/** Resolver for the Promise returned by showConflictModal(), so callers can await the user's choice. */
let modalResolve     = null;

// ─────────────────────────────────────────────────────────────────────────────
// Character encoding detection / decoding
//
// diff ファイルは UTF-8 以外に Shift_JIS / EUC-JP で保存されることがあるため、
// バイト列から自動判定して読み込む。判定を誤った場合に備え、プロジェクトごとに
// 明示的な文字コードを指定して読み込み直せるようにしてある（proj.encoding）。
// ─────────────────────────────────────────────────────────────────────────────
const ENCODING_LABELS = {
  auto:       '自動判定',
  'utf-8':    'UTF-8',
  shift_jis:  'Shift_JIS',
  'euc-jp':   'EUC-JP',
};

const VALID_ENCODINGS = ['auto', 'utf-8', 'shift_jis', 'euc-jp'];

/** Coerce any stored/imported encoding value back to 'auto' if it's not one we recognize. */
function normalizeEncoding(value) {
  return VALID_ENCODINGS.includes(value) ? value : 'auto';
}

/** Score how well `bytes` parses as Shift_JIS 2-byte sequences (higher = more plausible). */
function scoreShiftJis(bytes) {
  let score = 0;
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if ((b >= 0x81 && b <= 0x9f) || (b >= 0xe0 && b <= 0xfc)) {
      const next = bytes[i + 1];
      if (next !== undefined && next >= 0x40 && next <= 0xfc && next !== 0x7f) {
        score += 2;
        i++;
      } else {
        score -= 3;
      }
    } else if ((b >= 0x80 && b <= 0xa0 && b !== 0x80) || b >= 0xfd) {
      score -= 3; // byte with no valid role as a Shift_JIS lead byte
    }
  }
  return score;
}

/** Score how well `bytes` parses as EUC-JP 2/3-byte sequences (higher = more plausible). */
function scoreEucJp(bytes) {
  let score = 0;
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if (b === 0x8e) { // half-width kana lead byte
      const next = bytes[i + 1];
      if (next !== undefined && next >= 0xa1 && next <= 0xdf) { score += 2; i++; }
      else score -= 3;
    } else if (b === 0x8f) { // JIS X 0212 lead byte
      const n1 = bytes[i + 1], n2 = bytes[i + 2];
      if (n1 !== undefined && n1 >= 0xa1 && n1 <= 0xfe && n2 !== undefined && n2 >= 0xa1 && n2 <= 0xfe) { score += 3; i += 2; }
      else score -= 3;
    } else if (b >= 0xa1 && b <= 0xfe) {
      const next = bytes[i + 1];
      if (next !== undefined && next >= 0xa1 && next <= 0xfe) { score += 2; i++; }
      else score -= 3;
    } else if (b >= 0x80 && b <= 0xa0) {
      score -= 3;
    }
  }
  return score;
}

/**
 * Auto-detect and decode `buffer` in a single pass. Strict (fatal) UTF-8
 * decoding is tried first since real Shift_JIS/EUC-JP text essentially
 * never happens to be valid UTF-8 beyond a few bytes; its decoded result is
 * reused directly (most diffs are UTF-8, so this avoids decoding the whole
 * buffer twice). If it fails, the bytes are scored against both legacy
 * Japanese encodings and the higher scorer is decoded.
 * @returns {{text: string, encoding: 'utf-8'|'shift_jis'|'euc-jp'}}
 */
function decodeAuto(buffer) {
  const bytes = new Uint8Array(buffer);
  const hasBom = bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf;

  if (!hasBom) {
    try {
      const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      return { text, encoding: 'utf-8' };
    } catch (e) {
      // Not valid UTF-8 - fall through to legacy Japanese encoding detection.
    }
  }

  if (hasBom) {
    return { text: new TextDecoder('utf-8').decode(buffer), encoding: 'utf-8' };
  }

  const sjisScore = scoreShiftJis(bytes);
  const eucScore  = scoreEucJp(bytes);
  const enc = eucScore > sjisScore ? 'euc-jp' : 'shift_jis';
  try {
    return { text: new TextDecoder(enc).decode(buffer), encoding: enc };
  } catch (e) {
    // Browser lacks this legacy encoding's decoder - fall back to UTF-8
    // rather than letting the RangeError abort the whole load.
    console.error(`Encoding "${enc}" unsupported by this browser, falling back to UTF-8`, e);
    return { text: new TextDecoder('utf-8').decode(buffer), encoding: 'utf-8' };
  }
}

/**
 * Decode `buffer` (an ArrayBuffer) into a string.
 * `encoding` may be 'auto' (or omitted) to auto-detect, or an explicit
 * 'utf-8' | 'shift_jis' | 'euc-jp' override.
 * @returns {{text: string, encoding: string}} the decoded text and the encoding actually used
 */
function decodeBytes(buffer, encoding) {
  if (!encoding || encoding === 'auto') return decodeAuto(buffer);
  try {
    return { text: new TextDecoder(encoding).decode(buffer), encoding };
  } catch (e) {
    console.error(`Unsupported encoding "${encoding}", falling back to UTF-8`, e);
    return { text: new TextDecoder('utf-8').decode(buffer), encoding: 'utf-8' };
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// localStorage helpers
// ─────────────────────────────────────────────────────────────────────────────
function loadProjects() {
  try {
    return JSON.parse(localStorage.getItem(SK_PROJECTS) || '[]');
  } catch (e) {
    console.error('Failed to parse projects from localStorage:', e);
    return [];
  }
}

function saveProjects(projects) {
  try {
    localStorage.setItem(SK_PROJECTS, JSON.stringify(projects));
  } catch (e) {
    console.error('Failed to save projects to localStorage:', e);
    alert('プロジェクトの保存に失敗しました。ストレージの容量が不足している可能性があります。');
  }
}

function loadProjectSort() {
  try {
    const val = localStorage.getItem(SK_PROJECT_SORT);
    return VALID_PROJECT_SORTS.includes(val) ? val : DEFAULT_PROJECT_SORT;
  } catch (e) {
    console.error('Failed to load project sort preference from localStorage:', e);
    return DEFAULT_PROJECT_SORT;
  }
}

function saveProjectSort(sortKey) {
  try {
    localStorage.setItem(SK_PROJECT_SORT, VALID_PROJECT_SORTS.includes(sortKey) ? sortKey : DEFAULT_PROJECT_SORT);
  } catch (e) {
    console.error('Failed to save project sort preference to localStorage:', e);
  }
}

// Sort a copy of the projects array according to the given sort key.
// Falls back to the default (newest updated first) for unknown keys.
function sortProjects(projects, sortKey) {
  const list = [...projects];
  const fileName = p => typeof p.fileName === 'string' ? p.fileName : '';
  switch (sortKey) {
    case 'updated-asc':
      return list.sort((a, b) => (a.lastUpdated || a.createdAt) - (b.lastUpdated || b.createdAt));
    case 'name-asc':
      return list.sort((a, b) => fileName(a).localeCompare(fileName(b), 'ja', { numeric: true, sensitivity: 'base' }));
    case 'name-desc':
      return list.sort((a, b) => fileName(b).localeCompare(fileName(a), 'ja', { numeric: true, sensitivity: 'base' }));
    case 'updated-desc':
    default:
      return list.sort((a, b) => (b.lastUpdated || b.createdAt) - (a.lastUpdated || a.createdAt));
  }
}

/**
 * Normalizes a stored review leaf value to a valid status string, or null
 * for "unreviewed". Coerces the pre-#51 boolean format (`true` → the
 * default 'approved' status) so old localStorage data and old exported
 * JSON files keep working; anything else invalid is dropped.
 */
function normalizeReviewStatus(value) {
  if (value === true) return 'approved';
  return VALID_REVIEW_STATUS_VALUES.includes(value) ? value : null;
}

// Rebuild with null-prototype objects to prevent prototype pollution
// from diff-derived (or imported) file paths used as object keys.
function sanitizeReviewsData(parsed) {
  const safe = Object.create(null);
  if (!parsed || typeof parsed !== 'object') return safe;
  for (const pid of Object.keys(parsed)) {
    safe[pid] = Object.create(null);
    const fileMap = parsed[pid];
    if (fileMap && typeof fileMap === 'object') {
      for (const fp of Object.keys(fileMap)) {
        safe[pid][fp] = Object.create(null);
        const hashMap = fileMap[fp];
        if (hashMap && typeof hashMap === 'object') {
          for (const h of Object.keys(hashMap)) {
            const status = normalizeReviewStatus(hashMap[h]);
            if (status) safe[pid][fp][h] = status;
          }
        }
      }
    }
  }
  return safe;
}

// ─────────────────────────────────────────────────────────────────────────────
// Keyword highlight (issue #10, categorised in issue #50)
//
// Users can register any number of keyword categories in the sidebar, each
// with its own comma-separated keyword list and background color. Any diff
// line whose content contains one of a category's keywords gets its
// matching substring wrapped in <mark class="keyword-hit"> using that
// category's color, so keywords of different intent (e.g. TODO vs SECURITY)
// stay visually distinct while reviewing. Matching is a plain
// case-insensitive substring search (no RegExp), so there is no need to
// escape user input and no ReDoS risk.
//
// Storage: SK_KEYWORDS holds a JSON-encoded array of
// { id, keywords, color } category objects. Older data was a bare
// comma-separated keyword string (pre-#50); loadKeywordCategories()
// transparently migrates that into a single yellow category on read.
// ─────────────────────────────────────────────────────────────────────────────
const DEFAULT_KEYWORD_COLOR = '#fff000';
const KEYWORD_CATEGORY_COLOR_PALETTE = ['#fff000', '#ffadad', '#a0c4ff', '#caffbf', '#ffd6a5', '#bdb2ff'];

function generateKeywordCategoryId() {
  return `kwcat_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
}

/**
 * Keep only well-formed category entries; drop anything with an unexpected shape.
 * `countEnabled` (issue #59) toggles whether this category's keyword-match
 * count is shown; it defaults to false so pre-#59 data (and new categories)
 * don't start counting unasked.
 */
function sanitizeKeywordCategories(rawCategories) {
  if (!Array.isArray(rawCategories)) return [];
  const result = [];
  for (const c of rawCategories) {
    if (!c || typeof c !== 'object' || typeof c.keywords !== 'string') continue;
    const color = typeof c.color === 'string' && /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : DEFAULT_KEYWORD_COLOR;
    const id = typeof c.id === 'string' && c.id ? c.id : generateKeywordCategoryId();
    const countEnabled = c.countEnabled === true;
    result.push({ id, keywords: c.keywords, color, countEnabled });
  }
  return result;
}

function loadKeywordCategories() {
  let raw;
  try {
    raw = localStorage.getItem(SK_KEYWORDS);
  } catch (e) {
    console.error('Failed to load keywords from localStorage:', e);
    return [];
  }
  if (!raw) return [];

  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return sanitizeKeywordCategories(parsed);
  } catch (e) {
    // Not JSON — fall through to the legacy plain-string migration below.
  }

  // Legacy format (pre-#50): a bare comma-separated keyword string. Persist
  // the migrated array immediately so its generated id stays stable across
  // subsequent loads — otherwise every loadKeywordCategories() call would
  // mint a new id and break edits/deletes for these rows (they look up the
  // category by an id from a previous load).
  const migrated = [{ id: generateKeywordCategoryId(), keywords: raw, color: DEFAULT_KEYWORD_COLOR, countEnabled: false }];
  saveKeywordCategories(migrated);
  return migrated;
}

function saveKeywordCategories(categories) {
  try {
    localStorage.setItem(SK_KEYWORDS, JSON.stringify(categories));
  } catch (e) {
    console.error('Failed to save keywords to localStorage:', e);
    alert('キーワードの保存に失敗しました。ストレージの容量が不足している可能性があります。');
  }
}

// Parses a category's raw comma-separated input into a de-duplicated list of
// non-empty, trimmed keywords. Whitespace-only entries are dropped, so an
// empty/blank input yields an empty array (= no highlighting).
function parseKeywords(raw) {
  if (!raw) return [];
  const seen = new Set();
  const result = [];
  for (const part of raw.split(',')) {
    const kw = part.trim();
    if (!kw || seen.has(kw.toLowerCase())) continue;
    seen.add(kw.toLowerCase());
    result.push(kw);
  }
  return result;
}

/**
 * Returns the active keyword categories with their raw keyword string
 * already parsed, dropping categories with no keywords. Order matches the
 * saved category order and determines highlight priority when two
 * categories match overlapping text (earlier category wins — see
 * findKeywordRanges).
 * @returns {Array<{color:string, keywords:string[]}>}
 */
function getActiveKeywordGroups() {
  return loadKeywordCategories()
    .map(cat => ({ color: cat.color, keywords: parseKeywords(cat.keywords) }))
    .filter(g => g.keywords.length > 0);
}

function mergeRanges(ranges) {
  if (ranges.length === 0) return [];
  ranges.sort((a, b) => a.start - b.start);
  const merged = [ranges[0]];
  for (let i = 1; i < ranges.length; i++) {
    const last = merged[merged.length - 1];
    const cur  = ranges[i];
    if (cur.start <= last.end) {
      last.end = Math.max(last.end, cur.end);
    } else {
      merged.push(cur);
    }
  }
  return merged;
}

// Finds all (merged, non-overlapping) match ranges of a single set of
// same-color keywords within `text`, case-insensitively.
function findRawKeywordRanges(text, keywords) {
  const lowerText = text.toLowerCase();
  const ranges = [];
  for (const kw of keywords) {
    const lowerKw = kw.toLowerCase();
    if (!lowerKw) continue;
    let from = 0;
    while (true) {
      const idx = lowerText.indexOf(lowerKw, from);
      if (idx === -1) break;
      ranges.push({ start: idx, end: idx + lowerKw.length });
      from = idx + lowerKw.length;
    }
  }
  return mergeRanges(ranges);
}

/**
 * Counts how many times a category's keywords occur across every line of the
 * currently loaded diff (app.parsedDiff), regardless of the active review
 * filter — this reflects "全差分" (issue #59), not just the currently
 * rendered/filtered subset. Reuses findRawKeywordRanges() (case-insensitive,
 * merged/non-overlapping) per line, so it counts the same matches
 * applyKeywordHighlight() would find for this category on its own — unlike
 * findKeywordRanges(), there's no cross-category overlap trimming here since
 * each category's count is independent of the others.
 * @param {string[]} keywords
 * @returns {number}
 */
function countKeywordMatches(keywords) {
  if (!keywords || keywords.length === 0 || !app.parsedDiff) return 0;
  let total = 0;
  for (const file of app.parsedDiff) {
    for (const hunk of file.hunks) {
      for (const line of hunk.lines) {
        if (line.startsWith('\\')) continue; // "\ No newline at end of file" marker, not diff content
        const content = line.length > 1 ? line.slice(1) : '';
        total += findRawKeywordRanges(content, keywords).length;
      }
    }
  }
  return total;
}

// Subtracts `claimed` (sorted, non-overlapping) intervals from `ranges`
// (sorted, non-overlapping), returning the remaining pieces of `ranges`
// that don't overlap any claimed interval.
function subtractRanges(ranges, claimed) {
  if (claimed.length === 0) return ranges;
  const result = [];
  for (const r of ranges) {
    let segments = [{ start: r.start, end: r.end }];
    for (const c of claimed) {
      const next = [];
      for (const seg of segments) {
        if (c.end <= seg.start || c.start >= seg.end) {
          next.push(seg);
          continue;
        }
        if (c.start > seg.start) next.push({ start: seg.start, end: Math.min(c.start, seg.end) });
        if (c.end < seg.end) next.push({ start: Math.max(c.end, seg.start), end: seg.end });
      }
      segments = next;
    }
    result.push(...segments);
  }
  return result;
}

/**
 * Finds all match ranges of the given keyword groups within `text`,
 * case-insensitively (plain substring search, no RegExp). Each returned
 * range carries the color of the category it matched. When two categories'
 * keywords match overlapping text, the earlier group in `groups` wins the
 * overlap — its range is kept whole and later groups are trimmed around it.
 * @param {string} text
 * @param {Array<{color:string, keywords:string[]}>} groups
 * @returns {Array<{start:number, end:number, color:string}>} sorted, non-overlapping
 */
function findKeywordRanges(text, groups) {
  if (!groups || groups.length === 0 || !text) return [];
  let claimed = [];
  const colored = [];
  for (const group of groups) {
    const raw = findRawKeywordRanges(text, group.keywords);
    if (raw.length === 0) continue;
    for (const p of subtractRanges(raw, claimed)) colored.push({ start: p.start, end: p.end, color: group.color });
    claimed = mergeRanges([...claimed, ...raw]);
  }
  colored.sort((a, b) => a.start - b.start);
  return colored;
}

/** Picks black or white text for readable contrast against a hex background color. */
function contrastTextColor(hexColor) {
  const hex = hexColor.replace('#', '');
  if (hex.length !== 6) return '#24292e';
  const r = parseInt(hex.slice(0, 2), 16);
  const g = parseInt(hex.slice(2, 4), 16);
  const b = parseInt(hex.slice(4, 6), 16);
  const luminance = (r * 299 + g * 587 + b * 114) / 1000; // ITU-R BT.601 perceived luminance
  return luminance > 150 ? '#24292e' : '#ffffff';
}

// Walks the text nodes under `root` and wraps any keyword match in
// <mark class="keyword-hit">, colored per its matching category. Operates on
// the DOM directly (rather than via string/HTML manipulation) so it cannot
// corrupt highlight.js's markup.
function applyKeywordHighlight(root, groups) {
  if (!groups || groups.length === 0) return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) textNodes.push(node);

  for (const textNode of textNodes) {
    const text = textNode.nodeValue;
    const ranges = findKeywordRanges(text, groups);
    if (ranges.length === 0) continue;

    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const r of ranges) {
      if (r.start > pos) frag.appendChild(document.createTextNode(text.slice(pos, r.start)));
      const mark = document.createElement('mark');
      mark.className = 'keyword-hit';
      mark.style.backgroundColor = r.color;
      mark.style.color = contrastTextColor(r.color);
      mark.textContent = text.slice(r.start, r.end);
      frag.appendChild(mark);
      pos = r.end;
    }
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));

    textNode.parentNode.replaceChild(frag, textNode);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// File System Access API — remembered file handles (IndexedDB)
//
// FileSystemFileHandle objects are structured-cloneable but not JSON-
// serializable, so they can't live in localStorage alongside the rest of
// the app state. IndexedDB is used instead, keyed by project ID. When a
// handle is available for a project, the "reload" button can re-read the
// file straight from disk instead of asking the user to pick it again.
// ─────────────────────────────────────────────────────────────────────────────
const supportsFileSystemAccess = typeof window.showOpenFilePicker === 'function';
const HANDLE_DB_NAME = 'gitLocalReview_handles';
const HANDLE_STORE   = 'fileHandles';
const FOLDER_STORE   = 'folderHandles';

/** IDs of projects that currently have a stored file handle (kept in sync via refreshHandleIndex). */
let projectIdsWithHandles = new Set();

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(HANDLE_DB_NAME, 2);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(HANDLE_STORE)) {
        req.result.createObjectStore(HANDLE_STORE);
      }
      if (!req.result.objectStoreNames.contains(FOLDER_STORE)) {
        req.result.createObjectStore(FOLDER_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveFileHandle(projectId, handle) {
  try {
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).put(handle, projectId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    projectIdsWithHandles.add(projectId);
  } catch (e) {
    console.error('Failed to save file handle for', projectId, e);
  }
}

async function loadFileHandle(projectId) {
  try {
    const db = await openHandleDB();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(HANDLE_STORE, 'readonly').objectStore(HANDLE_STORE).get(projectId);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.error('Failed to load file handle for', projectId, e);
    return null;
  }
}

async function deleteFileHandleRecord(projectId) {
  try {
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).delete(projectId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    console.error('Failed to delete file handle for', projectId, e);
  } finally {
    projectIdsWithHandles.delete(projectId);
  }
}

/** Repopulate projectIdsWithHandles from IndexedDB (called once at init). */
async function refreshHandleIndex() {
  if (!supportsFileSystemAccess) return;
  try {
    const db = await openHandleDB();
    const keys = await new Promise((resolve, reject) => {
      const req = db.transaction(HANDLE_STORE, 'readonly').objectStore(HANDLE_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    projectIdsWithHandles = new Set(keys);
  } catch (e) {
    console.error('Failed to refresh file handle index', e);
  }
}

/**
 * Check (and, if needed, request) permission on a stored handle. Requesting
 * permission requires a user gesture, so callers running outside of one
 * (e.g. page-load auto-restore) should pass requestIfNeeded=false and treat
 * a non-granted result as "skip silently".
 */
async function verifyHandlePermission(handle, mode, requestIfNeeded = true) {
  const opts = { mode };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if (requestIfNeeded && (await handle.requestPermission(opts)) === 'granted') return true;
  } catch (e) {
    console.error('Permission check failed', e);
  }
  return false;
}

// Project ID generation  →  "filename__proj_YYYYMMDD_NNN"

function generateProjectId(fileName) {
  const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const prefix = `${fileName}__proj_${date}_`;
  const count = loadProjects().filter(p => p.id.startsWith(prefix)).length;
  return prefix + String(count + 1).padStart(3, '0');
}

// ─────────────────────────────────────────────────────────────────────────────
// Unified diff parser
// ─────────────────────────────────────────────────────────────────────────────
/**
 * Parse a unified diff string into a structured array.
 * @param {string} text
 * @returns {Array<{filePath:string, hunks:Array<{header:string, lines:string[]}>}>}
 */
function parseDiff(text) {
  const lines = text.split(/\r?\n/);
  const files = [];
  let curFile = null;
  let curHunk = null;

  function commitHunk() {
    if (curHunk && curFile) {
      for (const h of splitLargeHunk(curHunk)) curFile.hunks.push(h);
      curHunk = null;
    }
  }
  function commitFile() {
    commitHunk();
    if (curFile && curFile.hunks.length > 0) files.push(curFile);
    curFile = null;
  }

  for (const line of lines) {
    if (line.startsWith('diff --git ')) {
      commitFile();
      const m = line.match(/^diff --git a\/.+ b\/(.+)$/);
      curFile = { filePath: m ? m[1] : '', hunks: [] };

    } else if (line.startsWith('+++ ') && curFile) {
      // "+++ b/path" → prefer this for the file path (handles renames)
      const m = line.match(/^\+\+\+ b\/(.+)$/);
      if (m) curFile.filePath = m[1];
      // "+++ /dev/null" → deleted file; keep path from diff --git line

    } else if (line.startsWith('@@ ') && curFile) {
      commitHunk();
      curHunk = { header: line, lines: [] };

    } else if (curHunk) {
      if (
        line.startsWith('+') ||
        line.startsWith('-') ||
        line.startsWith(' ') ||
        line.startsWith('\\')          // "\ No newline at end of file"
      ) {
        curHunk.lines.push(line);
      }
    }
  }

  commitFile();
  return files;
}

// ─────────────────────────────────────────────────────────────────────────────
// Large-hunk splitting
// ─────────────────────────────────────────────────────────────────────────────
// A newly-added file is emitted by git as a single hunk containing every
// line of the file. Because the hunk's review hash covers all of its lines,
// touching even one line later invalidates the review status of the entire
// file. Splitting oversized hunks into smaller ones at blank-line
// boundaries keeps a small follow-up edit from re-invalidating an
// already-reviewed hunk that it doesn't actually touch.

/** Hunks with more than this many diff lines become eligible for splitting. */
const HUNK_SPLIT_LINE_THRESHOLD = 20;
/** A run of at least this many consecutive blank diff lines is a split point. */
const HUNK_SPLIT_BLANK_RUN = 2;

/**
 * A diff line is "blank" for split-boundary purposes when it carries no
 * content beyond its +/-/space prefix (i.e. the original source line was
 * empty). "\ No newline at end of file" marker lines are never blank.
 * @param {string} line
 * @returns {boolean}
 */
function isBlankDiffLine(line) {
  return line.length <= 1 && !line.startsWith('\\');
}

/**
 * Split a single hunk into several smaller hunks wherever a run of
 * HUNK_SPLIT_BLANK_RUN or more consecutive blank lines occurs, but only if
 * the hunk's total line count exceeds HUNK_SPLIT_LINE_THRESHOLD. Each blank
 * run is kept as trailing context of the sub-hunk that precedes it.
 * @param {{header:string, lines:string[]}} hunk
 * @returns {Array<{header:string, lines:string[]}>}
 */
function splitLargeHunk(hunk) {
  if (hunk.lines.length <= HUNK_SPLIT_LINE_THRESHOLD) return [hunk];

  const groups = [];
  let current = [];
  let i = 0;
  while (i < hunk.lines.length) {
    current.push(hunk.lines[i]);
    if (isBlankDiffLine(hunk.lines[i])) {
      let runLen = 1;
      while (i + runLen < hunk.lines.length && isBlankDiffLine(hunk.lines[i + runLen])) runLen++;
      for (let j = 1; j < runLen; j++) current.push(hunk.lines[i + j]);
      i += runLen;
      if (runLen >= HUNK_SPLIT_BLANK_RUN && i < hunk.lines.length) {
        groups.push(current);
        current = [];
      }
      continue;
    }
    i++;
  }
  if (current.length > 0) groups.push(current);

  if (groups.length <= 1) return [hunk];

  // Recompute each sub-hunk's old/new starting line number and line count
  // from the original hunk's header so line numbers stay correct even
  // though the sub-hunk headers are synthetic (not present in the source diff).
  const { oldStart, newStart } = parseHunkHeader(hunk.header);
  let oldN = oldStart, newN = newStart;
  return groups.map((groupLines, idx) => {
    const gOldStart = oldN, gNewStart = newN;
    let oldCount = 0, newCount = 0;
    for (const line of groupLines) {
      if (line.startsWith('\\')) continue;
      if (line[0] === '+') newCount++;
      else if (line[0] === '-') oldCount++;
      else { oldCount++; newCount++; }
    }
    oldN += oldCount;
    newN += newCount;
    return {
      header: `@@ -${gOldStart},${oldCount} +${gNewStart},${newCount} @@ (${idx + 1}/${groups.length})`,
      lines: groupLines,
    };
  });
}

// Syntax highlighting helpers
// ─────────────────────────────────────────────────────────────────────────────

/** Maps file extensions to highlight.js language identifiers. */
const EXT_TO_LANGUAGE = Object.freeze({
  'cpp': 'cpp', 'cc': 'cpp', 'cxx': 'cpp', 'c++': 'cpp',
  'h': 'cpp', 'hpp': 'cpp', 'hxx': 'cpp',
  'c': 'c',
  'js': 'javascript', 'mjs': 'javascript', 'cjs': 'javascript',
  'ts': 'typescript',
  'py': 'python',
  'rb': 'ruby',
  'go': 'go',
  'rs': 'rust',
  'java': 'java',
  'cs': 'csharp',
  'html': 'html', 'htm': 'html',
  'css': 'css',
  'sh': 'bash', 'bash': 'bash',
  'json': 'json',
  'xml': 'xml',
  'yaml': 'yaml', 'yml': 'yaml',
  'md': 'markdown',
  'sql': 'sql',
  'kt': 'kotlin',
  'swift': 'swift',
  'php': 'php',
  'scala': 'scala',
});

/**
 * Map a file extension to a highlight.js language identifier.
 * Returns null if the extension is not recognised.
 * @param {string} filePath
 * @returns {string|null}
 */
function detectLanguage(filePath) {
  // Extract the filename from the path, then find its extension using the
  // last dot so that dotfiles with extensions (e.g. ".myfile.cpp") work.
  // dotIdx < 0 rejects files with no dot (e.g. "Makefile"); dotIdx = 0
  // is the leading dot of a plain hidden file (e.g. ".gitignore"), which
  // has no meaningful extension — both are correctly rejected by <= 0.
  const fileName = filePath.split('/').pop();
  const dotIdx   = fileName.lastIndexOf('.');
  if (dotIdx <= 0) return null;
  const ext = fileName.slice(dotIdx + 1).toLowerCase();
  return EXT_TO_LANGUAGE[ext] || null;
}

/**
 * Split a highlight.js HTML string into individual lines, ensuring that
 * open <span> tags are properly closed at each line boundary and reopened
 * on the next line.  This preserves correct colouring across multi-line
 * constructs (e.g. block comments, string literals).
 * @param {string} html
 * @returns {string[]}
 */
function splitHighlightedLines(html) {
  const openTagStack = []; // stack of full opening tag strings, e.g. '<span class="hljs-comment">'

  // Build closing tags for all currently open spans (innermost first).
  // If a tag in the stack is somehow malformed, the regex returns null and
  // that entry contributes an empty string, which is safe to ignore.
  function buildClosers() {
    return openTagStack.slice().reverse().map(t => {
      const m = t.match(/^<(\w+)/);
      return m ? `</${m[1]}>` : '';
    }).join('');
  }

  const result = [];
  let line = '';
  let i = 0;

  while (i < html.length) {
    if (html[i] === '<') {
      const tagEnd = html.indexOf('>', i);
      if (tagEnd === -1) {
        // Malformed HTML: no closing '>' found. Close open tags to keep the
        // output valid up to this point, then append the remaining raw string
        // as-is. Rendering may be imperfect but won't produce infinite loops.
        line += buildClosers() + html.slice(i);
        break;
      }
      const tag = html.slice(i, tagEnd + 1);
      line += tag;
      if (!tag.startsWith('</') && !tag.endsWith('/>')) {
        openTagStack.push(tag);
      } else if (tag.startsWith('</')) {
        openTagStack.pop();
      }
      i = tagEnd + 1;
    } else if (html[i] === '\n') {
      // Close all open tags before line break, then reopen them on the next line
      result.push(line + buildClosers());
      line = openTagStack.join('');
      i++;
    } else {
      line += html[i];
      i++;
    }
  }

  if (line) result.push(line);
  return result;
}

/**
 * Reusable Range used to convert per-line highlight.js HTML strings into DOM
 * nodes via createContextualFragment (see buildContentCell). Fragment parsing
 * starts directly in the "in body" insertion mode, unlike
 * `DOMParser#parseFromString(html, 'text/html')`, which parses the string as
 * a full document and — per the HTML5 parsing algorithm's "initial"/"before
 * html"/"before head" insertion modes — silently drops any whitespace
 * (spaces/tabs) occurring before the first tag. Diff lines that are
 * highlighted (e.g. a line consisting solely of leading indentation before a
 * keyword span) start with exactly that kind of leading whitespace, so using
 * DOMParser here was silently stripping code indentation from highlighted
 * diff lines.
 */
const htmlFragmentRange = (typeof document !== 'undefined' && document.createRange)
  ? (() => { const r = document.createRange(); r.selectNodeContents(document.body); return r; })()
  : null;

/**
 * Highlight all lines of a hunk using highlight.js.
 * Returns an array of HTML strings (one per line, matching hunk.lines),
 * or null when highlighting is unavailable or the language is not detected.
 * When language is null this function returns immediately (O(1)), so it is
 * safe to call it unconditionally for every hunk.
 * @param {string[]} lines    – raw diff lines (each starts with +, -, or space)
 * @param {string|null} language
 * @param {string} [filePath] – used only in debug messages
 * @returns {string[]|null}
 */
function highlightHunkLines(lines, language, filePath) {
  if (!language || typeof hljs === 'undefined') return null;

  // Strip the diff prefix character (+/-/space). Lines starting with '\'
  // are the "\ No newline at end of file" marker — they contribute an empty
  // placeholder so the returned array index stays aligned with hunk.lines.
  const codeLines = lines.map(l => {
    if (l.startsWith('\\')) return '';
    return l.length > 1 ? l.slice(1) : '';
  });
  const code = codeLines.join('\n');

  let highlighted;
  try {
    highlighted = hljs.highlight(code, { language, ignoreIllegals: true }).value;
  } catch (e) {
    console.warn('highlight.js failed for language', language, 'in', filePath || '(unknown file)', e);
    return null;
  }

  return splitHighlightedLines(highlighted);
}

// ─────────────────────────────────────────────────────────────────────────────
// Hashing (Web Crypto API with non-cryptographic fallback for file:// etc.)
// ─────────────────────────────────────────────────────────────────────────────

// Simple djb2-based fallback used when crypto.subtle is unavailable
function djb2hex(text) {
  let h = 5381;
  for (let i = 0; i < text.length; i++) {
    h = ((h << 5) + h) + text.charCodeAt(i);
    h = h >>> 0; // keep unsigned 32-bit
  }
  return h.toString(16).padStart(8, '0');
}

async function sha256hex(text) {
  if (crypto && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (err) {
      console.error('crypto.subtle unavailable, using fallback hash:', err);
    }
  }
  return djb2hex(text);
}

/**
 * Attach a `hash` to each hunk. The hash covers only diff-content lines
 * (NOT the @@ header), so line-number shifts don't alter the hash.
 */
async function computeAllHashes(files) {
  const promises = [];
  for (const file of files) {
    for (const hunk of file.hunks) {
      const text = hunk.lines.join('\n');
      promises.push(
        (async () => {
          hunk.hash = await sha256hex(text);
        })()
      );
    }
  }
  await Promise.all(promises);
}

// ─────────────────────────────────────────────────────────────────────────────
// HTML escaping
// ─────────────────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────────────────────────────────────────
// Parse @@ header → starting line numbers
// ─────────────────────────────────────────────────────────────────────────────
function parseHunkHeader(header) {
  const m = header.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
  return m ? { oldStart: +m[1], newStart: +m[2] } : { oldStart: 1, newStart: 1 };
}

function renderProjectList() {
  const listEl = document.getElementById('project-list');
  const projects = loadProjects();

  if (projects.length === 0) {
