    return;
  }

  listEl.innerHTML = '';
  const sorted = sortProjects(projects, loadProjectSort());

  for (const proj of sorted) {
    const isActive = proj.id === app.currentProjectId;
    const item = document.createElement('div');
    item.className = 'project-item' + (isActive ? ' active' : '');

    const updated = new Date(proj.lastUpdated || proj.createdAt).toLocaleString('ja-JP', {
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    });

    const nameEl   = document.createElement('div'); nameEl.className = 'proj-name'; nameEl.title = proj.id; nameEl.textContent = proj.fileName;
    const idEl     = document.createElement('div'); idEl.className = 'proj-id'; idEl.textContent = proj.id;
    const metaEl   = document.createElement('div'); metaEl.className = 'proj-meta'; metaEl.textContent = `更新: ${updated}`;
    const actEl    = document.createElement('div'); actEl.className = 'proj-actions';

    const encEl = document.createElement('div');
    encEl.className = 'proj-encoding';
    const encLabel = document.createElement('span');
    encLabel.textContent = '文字コード:';
    const encSelect = document.createElement('select');
    encSelect.title = 'このプロジェクトのdiffファイルの文字コードを指定（自動判定を誤った場合の上書き用）';
    encSelect.setAttribute('aria-label', `${proj.fileName} の文字コード`);
    for (const val of VALID_ENCODINGS) {
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = (val === 'auto' && proj.resolvedEncoding)
        ? `${ENCODING_LABELS.auto}（${ENCODING_LABELS[proj.resolvedEncoding] || proj.resolvedEncoding}）`
        : ENCODING_LABELS[val];
      encSelect.appendChild(opt);
    }
    // Normalize against the allow-list: a corrupted/legacy/manually-edited
    // localStorage value must not leave the <select> on an option that
    // doesn't exist, nor get handed to decodeBytes() as a bogus encoding.
    encSelect.value = normalizeEncoding(proj.encoding);
    encSelect.addEventListener('click', e => e.stopPropagation());
    encSelect.addEventListener('change', e => {
      e.stopPropagation();
      changeProjectEncoding(proj.id, e.target.value);
    });
    encEl.appendChild(encLabel);
    encEl.appendChild(encSelect);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn btn-reset';
    resetBtn.textContent = '🔄 リセット';
    resetBtn.title = 'チェック状態をリセット';
    resetBtn.addEventListener('click', e => { e.stopPropagation(); resetProject(proj.id); });

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-delete';
    delBtn.textContent = '🗑 削除';
    delBtn.title = 'プロジェクトを削除';
    delBtn.addEventListener('click', e => { e.stopPropagation(); deleteProject(proj.id); });

    if (projectIdsWithHandles.has(proj.id)) {
      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'btn btn-reload';
      reloadBtn.textContent = '🔃 再読み込み';
      reloadBtn.title = '同じファイルをディスクから再読み込み';
      reloadBtn.addEventListener('click', e => { e.stopPropagation(); reloadProjectFile(proj.id); });
      actEl.appendChild(reloadBtn);
    }

    actEl.appendChild(resetBtn);
    actEl.appendChild(delBtn);
    item.appendChild(nameEl);
    item.appendChild(idEl);
    item.appendChild(metaEl);
    item.appendChild(encEl);
    item.appendChild(actEl);

    item.addEventListener('click', () => activateProject(proj.id));
    listEl.appendChild(item);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Render: stat summary (git diff --stat style)
// ─────────────────────────────────────────────────────────────────────────────
/**
 * Build and display a `git diff --stat`-like summary above the diff cards.
 * Each file row shows the filename (clickable to scroll to the section),
 * +additions / -deletions counts, and a visual bar of coloured squares.
 * @param {Array<{filePath:string, hunks:Array<{lines:string[]}>}>} files
 */
function renderStatSummary(files) {
  const panel = document.getElementById('stat-summary');
  panel.innerHTML = '';

  if (!files || files.length === 0) {
    panel.style.display = 'none';
    return;
  }

  // Compute per-file add/del counts
  const stats = files.map(file => {
    let add = 0, del = 0;
    for (const hunk of file.hunks) {
      for (const line of hunk.lines) {
        if (line.startsWith('+')) add++;
        else if (line.startsWith('-')) del++;
      }
    }
    return { filePath: file.filePath, add, del };
  });

  const totalAdd = stats.reduce((s, r) => s + r.add, 0);
  const totalDel = stats.reduce((s, r) => s + r.del, 0);
  const maxChange = Math.max(...stats.map(r => r.add + r.del), 1);
  const BAR_MAX = 10; // maximum squares per file

  // Header
  const header = document.createElement('div');
  header.className = 'stat-summary-header';
  header.textContent = `${files.length} ファイル変更`;
  panel.appendChild(header);

  // Per-file rows
  for (const stat of stats) {
    const row = document.createElement('div');
    row.className = 'stat-row';

    const nameEl = document.createElement('span');
    nameEl.className = 'stat-filename';
    nameEl.textContent = stat.filePath;
    nameEl.title = stat.filePath;
    nameEl.addEventListener('click', () => {
      // Find the corresponding file-section by matching its file-path text
      const sections = document.querySelectorAll('#diff-container .file-section');
      for (const sec of sections) {
        const pathEl = sec.querySelector('.file-path');
        if (pathEl && pathEl.textContent === stat.filePath) {
          sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        }
      }
    });

    const countEl = document.createElement('span');
    countEl.className = 'stat-counts';
    countEl.innerHTML =
      `<span class="stat-add">+${stat.add}</span>` +
      `<span class="stat-del">-${stat.del}</span>`;

    const addBars = Math.round((stat.add / maxChange) * BAR_MAX);
    const delBars = Math.round((stat.del / maxChange) * BAR_MAX);
    const barEl = document.createElement('span');
    barEl.className = 'stat-bar';
    barEl.innerHTML =
      '<span class="stat-bar-add"></span>'.repeat(addBars) +
      '<span class="stat-bar-del"></span>'.repeat(delBars);

    row.appendChild(nameEl);
    row.appendChild(countEl);
    row.appendChild(barEl);
    panel.appendChild(row);
  }

  // Total row
  const totalRow = document.createElement('div');
  totalRow.className = 'stat-row stat-total';
  totalRow.innerHTML =
    `<span style="flex:1">合計</span>` +
    `<span class="stat-counts">` +
    `<span class="stat-add">+${totalAdd}</span>` +
    `<span class="stat-del">-${totalDel}</span>` +
    `</span>`;
  panel.appendChild(totalRow);

  panel.style.display = '';
}

// ─────────────────────────────────────────────────────────────────────────────
// Render: full diff view
// ─────────────────────────────────────────────────────────────────────────────
function renderDiff() {
  const container  = document.getElementById('diff-container');
  const emptyState = document.getElementById('empty-state');
  container.innerHTML = '';
  app.fileProgressEls.clear();

  const files = app.parsedDiff;
  if (!files || files.length === 0) {
    emptyState.style.display = 'block';
    clearOverallProgress();
    app.focusedHunkIndex = -1;
    renderStatSummary(null);
    refreshKeywordCounts();
    return;
  }

  emptyState.style.display = 'none';

  const allReviews     = loadAllReviews();
  const projectReviews = app.currentProjectId ? (allReviews[app.currentProjectId] || Object.create(null)) : Object.create(null);

  const filter = app.reviewFilter;
  const filterActive = isReviewFilterActive(filter);
  let totalHunks = 0, totalReviewed = 0, totalNeedsChanges = 0, totalOnHold = 0;
  let renderedSections = 0;

  // Collect files that will actually be rendered (respects the review filter)
  const visibleFiles = filterActive
    ? files.filter(f => {
        const rev = projectReviews[f.filePath] || Object.create(null);
        return f.hunks.some(h => hunkPassesReviewFilter(rev[h.hash] || null, filter));
      })
    : files;

  renderStatSummary(visibleFiles.length > 0 ? visibleFiles : null);

  for (const file of files) {
    const fileReviews = projectReviews[file.filePath] || Object.create(null);
    let reviewedCnt = 0, needsChangesCnt = 0, onHoldCnt = 0;
    for (const h of file.hunks) {
      const status = fileReviews[h.hash] || null;
      if (status) reviewedCnt++;
      if (status === 'needs_changes') needsChangesCnt++;
      if (status === 'on_hold') onHoldCnt++;
    }
    totalHunks        += file.hunks.length;
    totalReviewed      += reviewedCnt;
    totalNeedsChanges  += needsChangesCnt;
    totalOnHold        += onHoldCnt;

    // Skip files with no hunk matching the active filter.
    const hasVisibleHunk = !filterActive || file.hunks.some(h => hunkPassesReviewFilter(fileReviews[h.hash] || null, filter));
    if (!hasVisibleHunk) continue;

    const section = document.createElement('div');
    section.className = 'file-section';

    // File header
    const fileHeader = document.createElement('div');
    fileHeader.className = 'file-header';

    const pathEl = document.createElement('span');
    pathEl.className = 'file-path';
    pathEl.textContent = file.filePath;

    const progressEl = document.createElement('span');
    progressEl.className = 'file-progress' + (reviewedCnt === file.hunks.length ? ' complete' : '');
    progressEl.textContent = `${reviewedCnt} / ${file.hunks.length} hunk レビュー済み`;
    app.fileProgressEls.set(file.filePath, progressEl);

    fileHeader.appendChild(pathEl);
    fileHeader.appendChild(progressEl);
    section.appendChild(fileHeader);

    // Hunks (skip ones that don't match the active filter)
    const fileLanguage = detectLanguage(file.filePath);
    for (const hunk of file.hunks) {
      const status = fileReviews[hunk.hash] || null;
      if (filterActive && !hunkPassesReviewFilter(status, filter)) continue;
      section.appendChild(buildHunkCard(file.filePath, hunk, status, fileLanguage));
    }

    container.appendChild(section);
    renderedSections++;
  }

  if (filterActive && renderedSections === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-state';
    const onlyNeedsChanges = filter.needs_changes && !filter.unreviewed && !filter.approved && !filter.on_hold;
    if (onlyNeedsChanges) {
      msg.innerHTML = '<span class="icon" aria-hidden="true">🎉</span>「要修正」のハンクはありません';
    } else {
      msg.innerHTML = totalHunks > 0
        ? '<span class="icon" aria-hidden="true">🎉</span>フィルタ条件に一致するハンクはありません'
        : '<span class="icon" aria-hidden="true">📄</span>表示できるハンクがありません';
    }
    container.appendChild(msg);
  }

  setOverallProgress(totalReviewed, totalHunks, totalNeedsChanges, totalOnHold);
  refreshKeywordCounts();

  // Reset keyboard hunk focus to the first hunk of the freshly rendered diff
  // (the previous focus index may point at an element that no longer exists).
  setFocusedHunk(0, { scroll: false });
}

/**
 * Whether a hunk with the given review status should be shown under the
 * current review filter. `status` is one of REVIEW_STATUSES' values, or
 * null/undefined for "unreviewed". `filter` is an app.reviewFilter-shaped
 * { [key]: boolean } map.
 */
function hunkPassesReviewFilter(status, filter) {
  return !!filter[status || 'unreviewed'];
}

// ─────────────────────────────────────────────────────────────────────────────
// Build a single hunk card element
// ─────────────────────────────────────────────────────────────────────────────
/**
 * Walk a hunk's raw diff lines once and compute, for every line, its type
 * ('+' / '-' / ' ' / '\\' for "no newline at end of file"), stripped content,
 * and old/new file line numbers. Both the unified and side-by-side renderers
 * are built on top of this shared list so line numbering is identical (and
 * reviewed/hash identity, which is derived from hunk.lines directly, is
 * completely unaffected by which renderer is used).
 * @param {{header:string, lines:string[]}} hunk
 * @returns {Array<{idx:number, type:string, content:string, oldLabel:(number|''), newLabel:(number|'')}>}
 */
function computeLineRecords(hunk) {
  const { oldStart, newStart } = parseHunkHeader(hunk.header);
  let oldN = oldStart, newN = newStart;
  const records = [];

  hunk.lines.forEach((line, idx) => {
    if (line.startsWith('\\')) {
      records.push({ idx, type: '\\', content: line, oldLabel: '', newLabel: '' });
      return;
    }

    const type    = line[0];
    const content = line.length > 1 ? line.slice(1) : '';
    let oldLabel = '', newLabel = '';
    if (type === '+') {
      newLabel = newN++;
    } else if (type === '-') {
      oldLabel = oldN++;
    } else {
      oldLabel = oldN++;
      newLabel = newN++;
    }

    records.push({ idx, type, content, oldLabel, newLabel });
  });

  return records;
}

/**
 * Build a <td class="line-content"> cell for a single diff line record,
 * reusing the pre-computed highlight.js output when available.
 * @param {{idx:number,type:string,content:string}|null} record
 * @param {string[]|null} hlLines
 * @param {string|null} extraCls - additional CSS class(es) for this cell, or null for none
 * @param {Array<{color:string, keywords:string[]}>} [keywordGroups] - active keyword categories to highlight within this cell's text (see applyKeywordHighlight)
 * @returns {HTMLTableCellElement}
 */
function buildContentCell(record, hlLines, extraCls, keywordGroups) {
  const td = document.createElement('td');
  td.className = 'line-content' + (extraCls ? ' ' + extraCls : '');
  if (!record) return td;

  const pfx = document.createElement('span');
  pfx.className = 'line-prefix';
  pfx.textContent = record.type === '\\' ? '' : record.type;
  td.appendChild(pfx);

  if (hlLines && record.idx < hlLines.length && htmlFragmentRange) {
    // Use a Range-based fragment parse to safely convert highlighted HTML
    // into DOM nodes (avoiding direct innerHTML assignment) without losing
    // leading indentation whitespace — see htmlFragmentRange's doc comment.
    const codeSpan = document.createElement('span');
    codeSpan.appendChild(htmlFragmentRange.createContextualFragment(hlLines[record.idx]));
    td.appendChild(codeSpan);
  } else {
    td.appendChild(document.createTextNode(record.content));
  }

  if (keywordGroups && keywordGroups.length) applyKeywordHighlight(td, keywordGroups);

  return td;
}

/**
 * Build the <tbody> for the current (single-column) unified diff view.
 */
function buildUnifiedTbody(hunk, hlLines, keywordGroups) {
  const tbody = document.createElement('tbody');
  const records = computeLineRecords(hunk);

  for (const record of records) {
    const tr = document.createElement('tr');

    if (record.type === '\\') {
      const td = document.createElement('td');
      td.colSpan = 3;
      td.className = 'line-content line-no-newline';
      td.textContent = record.content;
      if (keywordGroups && keywordGroups.length) applyKeywordHighlight(td, keywordGroups);
      tr.appendChild(td);
      tbody.appendChild(tr);
      continue;
    }

    const cls = record.type === '+' ? 'line-add' : record.type === '-' ? 'line-del' : 'line-context';
    tr.className = cls;

    const tdOld = document.createElement('td'); tdOld.className = 'line-num'; tdOld.textContent = String(record.oldLabel);
    const tdNew = document.createElement('td'); tdNew.className = 'line-num'; tdNew.textContent = String(record.newLabel);
    const tdCon = buildContentCell(record, hlLines, null, keywordGroups);

    tr.appendChild(tdOld); tr.appendChild(tdNew); tr.appendChild(tdCon);
    tbody.appendChild(tr);
  }

  return tbody;
}

/**
 * Build the <tbody> for the side-by-side (split) diff view: removed lines on
 * the left, added lines on the right, context lines spanning both sides.
 *
 * Pairing strategy: consecutive runs of '-' lines and consecutive runs of
 * '+' lines within a hunk are grouped and paired row-by-row (the shorter
 * side is padded with an empty cell). This is a simple, standard approach
 * for side-by-side diff views and does not require a full realignment
 * (Myers-style) of old vs. new content.
 */
function buildSplitTbody(hunk, hlLines, keywordGroups) {
  const tbody = document.createElement('tbody');
  const records = computeLineRecords(hunk);

  let pendingDel = [];
  let pendingAdd = [];

  function emitPairedRow(delRec, addRec) {
    const tr = document.createElement('tr');
    tr.className = 'line-split-row';

    const oldCls = delRec ? 'line-del' : 'line-empty';
    const newCls = addRec ? 'line-add' : 'line-empty';

    const tdOldNum = document.createElement('td');
    tdOldNum.className = 'line-num ' + oldCls;
    tdOldNum.textContent = delRec ? String(delRec.oldLabel) : '';

    const tdOldContent = buildContentCell(delRec, hlLines, oldCls, keywordGroups);

    const tdNewNum = document.createElement('td');
    tdNewNum.className = 'line-num col-divider ' + newCls;
    tdNewNum.textContent = addRec ? String(addRec.newLabel) : '';

    const tdNewContent = buildContentCell(addRec, hlLines, newCls, keywordGroups);

    tr.appendChild(tdOldNum);
    tr.appendChild(tdOldContent);
    tr.appendChild(tdNewNum);
    tr.appendChild(tdNewContent);
    tbody.appendChild(tr);
  }

  function flushPending() {
    const rows = Math.max(pendingDel.length, pendingAdd.length);
    for (let i = 0; i < rows; i++) {
      emitPairedRow(pendingDel[i] || null, pendingAdd[i] || null);
    }
    pendingDel = [];
    pendingAdd = [];
  }

  function emitContextRow(record) {
    const tr = document.createElement('tr');
    tr.className = 'line-context';

    const tdOldNum = document.createElement('td');
    tdOldNum.className = 'line-num';
    tdOldNum.textContent = String(record.oldLabel);

    // Context rows show identical content on both sides; build it once and
    // clone the node for the second column instead of re-parsing the same
    // highlighted HTML twice.
    const tdOldContent = buildContentCell(record, hlLines, null, keywordGroups);

    const tdNewNum = document.createElement('td');
    tdNewNum.className = 'line-num col-divider';
    tdNewNum.textContent = String(record.newLabel);

    const tdNewContent = tdOldContent.cloneNode(true);

    tr.appendChild(tdOldNum);
    tr.appendChild(tdOldContent);
    tr.appendChild(tdNewNum);
    tr.appendChild(tdNewContent);
    tbody.appendChild(tr);
  }

  function emitMarkerRow(record) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 4;
    td.className = 'line-content line-no-newline';
    td.textContent = record.content;
    if (keywordGroups && keywordGroups.length) applyKeywordHighlight(td, keywordGroups);
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  for (const record of records) {
    if (record.type === '-') {
      // A new deletion block starting after an already-collected addition
      // block (i.e. a second replace within the same hunk) — flush first so
      // the two blocks don't get paired against each other.
      if (pendingAdd.length > 0) flushPending();
      pendingDel.push(record);
    } else if (record.type === '+') {
      pendingAdd.push(record);
    } else {
      flushPending();
      if (record.type === '\\') {
        emitMarkerRow(record);
      } else {
        emitContextRow(record);
      }
    }
  }
  flushPending();

  return tbody;
}

function buildHunkCard(filePath, hunk, status, language = null) {
  const card = document.createElement('div');
  const startsCollapsed = status === 'approved';
  card.className = 'hunk-card' + (status ? ' status-' + status : '') + (startsCollapsed ? ' collapsed' : '');
  card.dataset.filePath = filePath;
  card.dataset.hunkHash = hunk.hash;

  // ── Header bar ──────────────────────────────────────
  const bar = document.createElement('div');
  bar.className = 'hunk-header-bar';

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'hunk-toggle-btn';
  toggleBtn.title = startsCollapsed ? '展開' : '折りたたむ';
  toggleBtn.textContent = startsCollapsed ? '▶' : '▼';
  toggleBtn.addEventListener('click', () => {
    setHunkCollapsedState(card, !card.classList.contains('collapsed'));
  });

  const headerText = document.createElement('span');
  headerText.className = 'hunk-header-text';
  headerText.textContent = hunk.header;

  const statusGroup = document.createElement('div');
  statusGroup.className = 'review-status-group';
  statusGroup.setAttribute('role', 'group');
  statusGroup.setAttribute('aria-label', 'レビュー状態');
  for (const s of REVIEW_STATUSES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'review-status-btn status-' + s.value + (status === s.value ? ' active' : '');
    btn.dataset.status = s.value;
    btn.title = `${s.label}（キーボード: ${s.key}）`;
    btn.setAttribute('aria-pressed', String(status === s.value));
    btn.textContent = `${s.icon} ${s.label}`;
    btn.addEventListener('click', () => {
      const nextStatus = btn.classList.contains('active') ? null : s.value;
      setHunkReviewStatus(card, filePath, hunk.hash, nextStatus);
    });
    statusGroup.appendChild(btn);
  }

  bar.appendChild(toggleBtn);
  bar.appendChild(headerText);
  bar.appendChild(statusGroup);
  card.appendChild(bar);

  // ── Diff table ──────────────────────────────────────
  const body = document.createElement('div');
  body.className = 'hunk-body';

  const table = document.createElement('table');
  const isSplit = app.viewMode === 'split';
  table.className = 'diff-table' + (isSplit ? ' diff-table-split' : '');

  // Pre-compute highlighted lines for this hunk (may be null if unavailable).
  // When language is null, highlightHunkLines returns immediately (O(1)).
  const hlLines = highlightHunkLines(hunk.lines, language, filePath);

  // Keyword categories are read once per hunk render; changing them
  // re-renders the whole diff (see the keyword-categories listeners below),
  // so this always reflects the latest configured list.
  const keywordGroups = getActiveKeywordGroups();

  if (isSplit) {
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    const thOld = document.createElement('th'); thOld.colSpan = 2; thOld.textContent = '変更前';
    const thNew = document.createElement('th'); thNew.colSpan = 2; thNew.className = 'col-divider'; thNew.textContent = '変更後';
    trHead.appendChild(thOld); trHead.appendChild(thNew);
    thead.appendChild(trHead);
    table.appendChild(thead);
    table.appendChild(buildSplitTbody(hunk, hlLines, keywordGroups));
  } else {
    table.appendChild(buildUnifiedTbody(hunk, hlLines, keywordGroups));
  }

  body.appendChild(table);
  card.appendChild(body);

  // Clicking anywhere in the hunk (header bar or diff body) focuses it, so
  // it can be reviewed with the mouse-click + Space keyboard shortcut flow
  // alongside j/k navigation. Skip when the click is the end of a text
  // selection drag within this card (e.g. copying diff text) rather than a
  // plain click — a leftover selection elsewhere on the page shouldn't block
  // focusing this hunk.
  card.addEventListener('click', () => {
    const selection = window.getSelection();
    if (selection && !selection.isCollapsed &&
        card.contains(selection.anchorNode) && card.contains(selection.focusNode)) {
      return;
    }
    const index = getHunkCards().indexOf(card);
    if (index !== -1) setFocusedHunk(index, { scroll: false });
  });

  return card;
}

// ─────────────────────────────────────────────────────────────────────────────
// Set collapsed state on a hunk card
// ─────────────────────────────────────────────────────────────────────────────
function setHunkCollapsedState(card, collapsed) {
  const btn = card.querySelector('.hunk-toggle-btn');
  if (collapsed) {
    card.classList.add('collapsed');
    if (btn) { btn.textContent = '▶'; btn.title = '展開'; }
  } else {
    card.classList.remove('collapsed');
    if (btn) { btn.textContent = '▼'; btn.title = '折りたたむ'; }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Review status change (issue #51)
// ─────────────────────────────────────────────────────────────────────────────
/**
 * Sets (or clears, if `newStatus` is null) a hunk's review status, persists
 * it, updates the card's DOM in place (status classes, status buttons,
 * collapse state), and refreshes progress/filtering.
 * @param {HTMLElement} card
 * @param {string} filePath
 * @param {string} hash
 * @param {string|null} newStatus - one of REVIEW_STATUSES' values, or null for "unreviewed"
 */
function setHunkReviewStatus(card, filePath, hash, newStatus) {
  const allReviews = loadAllReviews();
  if (!allReviews[app.currentProjectId])           allReviews[app.currentProjectId] = Object.create(null);
  if (!allReviews[app.currentProjectId][filePath]) allReviews[app.currentProjectId][filePath] = Object.create(null);

  if (newStatus) {
    allReviews[app.currentProjectId][filePath][hash] = newStatus;
  } else {
    delete allReviews[app.currentProjectId][filePath][hash];
  }
  saveAllReviews(allReviews);
  scheduleSettingsAutoSave();

  for (const s of REVIEW_STATUSES) card.classList.remove('status-' + s.value);
  if (newStatus) card.classList.add('status-' + newStatus);

  for (const btn of card.querySelectorAll('.review-status-btn')) {
    const isActive = btn.dataset.status === newStatus;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', String(isActive));
  }
  setHunkCollapsedState(card, newStatus === 'approved');

  if (isReviewFilterActive(app.reviewFilter)) {
    // The review filter needs hunks/files to appear or disappear
    // immediately, so re-run the full render rather than a lightweight update.
    renderDiff();
  } else {
    refreshProgress();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Refresh progress badges without re-rendering the whole diff
// ─────────────────────────────────────────────────────────────────────────────
function refreshProgress() {
  if (!app.parsedDiff || !app.currentProjectId) return;

  const projectReviews = (loadAllReviews()[app.currentProjectId]) || Object.create(null);
  let totalHunks = 0, totalReviewed = 0, totalNeedsChanges = 0, totalOnHold = 0;

  for (const file of app.parsedDiff) {
    const fileReviews = projectReviews[file.filePath] || Object.create(null);
    let rev = 0, needsChanges = 0, onHold = 0;
    for (const h of file.hunks) {
      const status = fileReviews[h.hash] || null;
      if (status) rev++;
      if (status === 'needs_changes') needsChanges++;
      if (status === 'on_hold') onHold++;
    }
    const total = file.hunks.length;
    totalHunks        += total;
    totalReviewed      += rev;
    totalNeedsChanges  += needsChanges;
    totalOnHold        += onHold;

    const el = app.fileProgressEls.get(file.filePath);
    if (el) {
      el.textContent = `${rev} / ${total} hunk レビュー済み`;
      el.className   = 'file-progress' + (rev === total ? ' complete' : '');
    }
  }

  setOverallProgress(totalReviewed, totalHunks, totalNeedsChanges, totalOnHold);
}

function setOverallProgress(reviewed, total, needsChanges = 0, onHold = 0) {
  const el = document.getElementById('overall-progress');
  let text = `全体: ${reviewed} / ${total} hunk レビュー済み`;
  const breakdown = [];
  if (needsChanges > 0) breakdown.push(`要修正 ${needsChanges}`);
  if (onHold > 0) breakdown.push(`保留 ${onHold}`);
  if (breakdown.length > 0) text += `（${breakdown.join('・')}）`;
  el.textContent = text;
  el.classList.toggle('has-progress', reviewed > 0);
}

// ─────────────────────────────────────────────────────────────────────────────
// Review memos — free-form per-project checklist notes shown in a slide-in
// panel, unrelated to any specific file/hunk (see loadAllReviews for that).
// ─────────────────────────────────────────────────────────────────────────────
function generateMemoId() {
  return `memo_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
}

function getCurrentProjectMemos() {
  if (!app.currentProjectId) return [];
  return loadAllMemos()[app.currentProjectId] || [];
}

/** Refresh the always-visible topbar badge (count of not-yet-done memos). */
function refreshMemoBadge() {
  const badge = document.getElementById('memo-badge');
  if (!badge) return;
  const openCount = getCurrentProjectMemos().filter(m => !m.done).length;
  badge.textContent = String(openCount);
  badge.hidden = openCount === 0;
}

function buildMemoItem(memo) {
  const li = document.createElement('li');
  li.className = 'memo-item' + (memo.done ? ' done' : '');

  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = memo.done;
  cb.addEventListener('change', () => toggleMemoDone(memo.id, cb.checked));

  const text = document.createElement('span');
  text.className = 'memo-text';
  text.textContent = memo.text;

  label.appendChild(cb);
  label.appendChild(text);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'memo-item-delete';
  delBtn.title = '削除';
  delBtn.setAttribute('aria-label', 'メモを削除');
  delBtn.textContent = '🗑';
  delBtn.addEventListener('click', () => deleteMemo(memo.id));

  li.appendChild(label);
  li.appendChild(delBtn);
  return li;
}

/** Re-render the memo list inside the panel for the current project. */
function renderMemoList() {
  const listEl  = document.getElementById('memo-list');
  const emptyEl = document.getElementById('memo-empty');
  const input   = document.getElementById('memo-input');
  const addBtn  = document.querySelector('.memo-add-btn');
  listEl.innerHTML = '';

  if (!app.currentProjectId) {
    input.disabled = true;
    addBtn.disabled = true;
    emptyEl.textContent = 'プロジェクトを開くとメモを追加できます。';
    emptyEl.style.display = 'block';
    return;
  }
  input.disabled = false;
  addBtn.disabled = false;

  const memos = getCurrentProjectMemos();
  if (memos.length === 0) {
    emptyEl.textContent = 'メモはまだありません。';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const pending = memos.filter(m => !m.done);
  const done    = memos.filter(m => m.done);

  for (const m of pending) listEl.appendChild(buildMemoItem(m));
  if (done.length > 0) {
    const divider = document.createElement('li');
    divider.className = 'memo-list-divider';
    divider.textContent = `対応済み（${done.length}）`;
    listEl.appendChild(divider);
    for (const m of done) listEl.appendChild(buildMemoItem(m));
  }
}

function addMemo(text) {
  const trimmed = text.trim();
  if (!trimmed || !app.currentProjectId) return;

  const all = loadAllMemos();
  if (!all[app.currentProjectId]) all[app.currentProjectId] = [];
  const now = Date.now();
  all[app.currentProjectId].push({ id: generateMemoId(), text: trimmed, done: false, createdAt: now, updatedAt: now });
  saveAllMemos(all);
  scheduleSettingsAutoSave();

  renderMemoList();
  refreshMemoBadge();
}

function toggleMemoDone(memoId, done) {
  if (!app.currentProjectId) return;
  const all  = loadAllMemos();
  const list = all[app.currentProjectId] || [];
  const memo = list.find(m => m.id === memoId);
  if (!memo) return;
  memo.done = done;
  memo.updatedAt = Date.now();
  saveAllMemos(all);
  scheduleSettingsAutoSave();

  renderMemoList();
  refreshMemoBadge();
}

function deleteMemo(memoId) {
  if (!app.currentProjectId) return;
  const all  = loadAllMemos();
  const list = all[app.currentProjectId] || [];
  const idx  = list.findIndex(m => m.id === memoId);
  if (idx === -1) return;
  list.splice(idx, 1);
  saveAllMemos(all);
  scheduleSettingsAutoSave();

  renderMemoList();
  refreshMemoBadge();
}

/** Remove all memos belonging to a permanently deleted project. */
function deleteMemosForProject(projectId) {
  const all = loadAllMemos();
  if (!(projectId in all)) return;
  delete all[projectId];
  saveAllMemos(all);
}

/**
 * Matches the CSS breakpoint (issue #57) at which the memo panel docks
 * permanently as a third flex column instead of behaving as a slide-in
 * overlay. Kept in sync with the `@media (min-width: 1200px)` rule above.
 */
const WIDE_LAYOUT_MEDIA_QUERY = window.matchMedia('(min-width: 1200px)');

function isMemoPanelOpen() {
  return WIDE_LAYOUT_MEDIA_QUERY.matches || document.getElementById('memo-panel').classList.contains('open');
}

/**
 * Called whenever the active project changes (and on init, and when crossing
 * the WIDE_LAYOUT_MEDIA_QUERY breakpoint) to keep the badge/panel in sync.
 * Also keeps aria-hidden correct: while docked open on a wide viewport,
 * openMemoPanel() is never called (its trigger, #memo-toggle-btn, is
 * CSS-hidden there), so nothing else clears the markup's default
 * aria-hidden="true" — without this, assistive tech would treat the
 * always-visible panel as hidden.
 */
function refreshMemoUI() {
  const open = isMemoPanelOpen();
  document.getElementById('memo-panel').setAttribute('aria-hidden', open ? 'false' : 'true');
  refreshMemoBadge();
  if (open) renderMemoList();
}

function openMemoPanel() {
  document.getElementById('memo-panel').classList.add('open');
  document.getElementById('memo-panel').setAttribute('aria-hidden', 'false');
  document.getElementById('memo-panel-overlay').classList.add('active');
  document.getElementById('memo-toggle-btn').setAttribute('aria-expanded', 'true');
  renderMemoList();
  const input = document.getElementById('memo-input');
  if (!input.disabled) input.focus();
}

function closeMemoPanel() {
  document.getElementById('memo-panel').classList.remove('open');
  document.getElementById('memo-panel').setAttribute('aria-hidden', 'true');
  document.getElementById('memo-panel-overlay').classList.remove('active');
  const toggleBtn = document.getElementById('memo-toggle-btn');
  toggleBtn.setAttribute('aria-expanded', 'false');
  // Return focus to the toggle button so it doesn't stay stranded on a
  // now off-screen element inside the panel (e.g. after Escape or an
  // overlay click, rather than a direct click on the close button).
  if (document.getElementById('memo-panel').contains(document.activeElement)) {
    toggleBtn.focus();
  }
}

function initMemoPanelResizer() {
  const panel = document.getElementById('memo-panel');
  const handle = document.getElementById('memo-panel-resizer');
  if (!panel || !handle) return;

  let minWidth = 0;
  let startX = 0;
  let startWidth = 0;
  let maxWidth = 0;
  let isResizing = false;

  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    startX = e.clientX;
    startWidth = panel.getBoundingClientRect().width;
    minWidth = Number.parseFloat(getComputedStyle(panel).minWidth);
    if (!Number.isFinite(minWidth)) minWidth = 0;
    maxWidth = Number.parseFloat(getComputedStyle(panel).maxWidth);
    if (!Number.isFinite(maxWidth)) maxWidth = window.innerWidth;
    isResizing = true;
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener('pointermove', (e) => {
    if (!isResizing || !handle.hasPointerCapture(e.pointerId)) return;
    const delta = startX - e.clientX;
    const nextWidth = Math.min(maxWidth, Math.max(minWidth, startWidth + delta));
    panel.style.width = `${nextWidth}px`;
  });

  const stopResize = () => {
    isResizing = false;
  };
  handle.addEventListener('pointerup', stopResize);
  handle.addEventListener('pointercancel', stopResize);
  handle.addEventListener('lostpointercapture', stopResize);
}

// ─────────────────────────────────────────────────────────────────────────────
// Keyboard navigation between hunks (j/k to move focus, Space to toggle
// レビュー済み on the focused hunk). See keydown listener near the bottom of
// this script for the key handling itself.
// ─────────────────────────────────────────────────────────────────────────────
function getHunkCards() {
  return Array.from(document.querySelectorAll('#diff-container .hunk-card'));
}

function updateFocusedHunkVisual() {
  const cards = getHunkCards();
  cards.forEach((card, i) => {
    card.classList.toggle('focused', i === app.focusedHunkIndex);
  });
}

// Moves keyboard focus to the hunk at `index` (clamped to the valid range of
// currently rendered hunks) and scrolls it into view unless `scroll: false`.
function setFocusedHunk(index, { scroll = true } = {}) {
  const cards = getHunkCards();
  if (cards.length === 0) {
    app.focusedHunkIndex = -1;
    return;
  }

  const clamped = Math.max(0, Math.min(index, cards.length - 1));
  app.focusedHunkIndex = clamped;
  updateFocusedHunkVisual();

  if (scroll) {
    cards[clamped].scrollIntoView({ block: 'nearest' });
  }
}

function moveHunkFocus(delta) {
  const cards = getHunkCards();
  if (cards.length === 0) return;
  const current = app.focusedHunkIndex >= 0 ? app.focusedHunkIndex : 0;
  setFocusedHunk(current + delta);
}

/** Reads the currently focused hunk card's review status from its DOM classes, or null. */
function getHunkStatus(card) {
  for (const s of REVIEW_STATUSES) {
    if (card.classList.contains('status-' + s.value)) return s.value;
  }
  return null;
}

/** Space: cycles the focused hunk's status unreviewed → approved → needs_changes → on_hold → unreviewed. */
function cycleFocusedHunkStatus() {
  const cards = getHunkCards();
  if (app.focusedHunkIndex < 0 || app.focusedHunkIndex >= cards.length) return;
  const card = cards[app.focusedHunkIndex];
  const cycle = [null, ...REVIEW_STATUSES.map(s => s.value)];
  const next = cycle[(cycle.indexOf(getHunkStatus(card)) + 1) % cycle.length];
  setHunkReviewStatus(card, card.dataset.filePath, card.dataset.hunkHash, next);
}

/** Number keys (1/2/3): directly sets the focused hunk's status, toggling off if already set. */
function setFocusedHunkStatus(value) {
  const cards = getHunkCards();
  if (app.focusedHunkIndex < 0 || app.focusedHunkIndex >= cards.length) return;
  const card = cards[app.focusedHunkIndex];
  const next = getHunkStatus(card) === value ? null : value;
  setHunkReviewStatus(card, card.dataset.filePath, card.dataset.hunkHash, next);
}

function clearOverallProgress() {
  const el = document.getElementById('overall-progress');
  el.textContent = '';
  el.classList.remove('has-progress');
}

// ─────────────────────────────────────────────────────────────────────────────
// View mode toggle (unified <-> side-by-side)
// ─────────────────────────────────────────────────────────────────────────────
function updateViewModeButtons() {
  const unifiedBtn = document.getElementById('view-mode-unified');
  const splitBtn   = document.getElementById('view-mode-split');
  if (unifiedBtn) {
    unifiedBtn.classList.toggle('active', app.viewMode === 'unified');
    unifiedBtn.setAttribute('aria-pressed', String(app.viewMode === 'unified'));
  }
  if (splitBtn) {
    splitBtn.classList.toggle('active', app.viewMode === 'split');
    splitBtn.setAttribute('aria-pressed', String(app.viewMode === 'split'));
  }
}

function setViewMode(mode) {
  if (mode !== 'unified' && mode !== 'split') return;
  if (app.viewMode === mode) return;
  app.viewMode = mode;
  saveViewMode(mode);
  updateViewModeButtons();
  // Re-render immediately so the change is visible without reloading the file.
  // The reviewed/collapsed state lives in localStorage keyed by hunk hash, not
  // by DOM state, so it is unaffected by which renderer builds the markup.
  renderDiff();
}

// ─────────────────────────────────────────────────────────────────────────────
// Empty state helpers
// ─────────────────────────────────────────────────────────────────────────────
function showEmptyState(html) {
  document.getElementById('diff-container').innerHTML = '';
  app.fileProgressEls.clear();
  const el = document.getElementById('empty-state');
  el.innerHTML = html;
  el.style.display = 'block';
  clearOverallProgress();
}

// ─────────────────────────────────────────────────────────────────────────────
// Project actions
// ─────────────────────────────────────────────────────────────────────────────

/** Switch active project selection in the sidebar and restore its last diff, if saved */
async function activateProject(projectId) {
  if (app.currentProjectId === projectId) return;
  const proj = loadProjects().find(p => p.id === projectId);
  if (!proj) return;

  app.currentProjectId = projectId;
  app.parsedDiff = null;
  localStorage.setItem(SK_CURRENT, projectId);
  refreshMemoUI();

  renderProjectList();
  // Clear the previous project's diff (and its checkboxes) immediately so
  // there's no window where the visible hunks belong to a different project
  // than app.currentProjectId while restoreProjectDiff's hashing is pending.
  showEmptyState(`
    <span class="icon" aria-hidden="true">⏳</span>
    プロジェクト「${esc(proj.fileName)}」を読み込み中…
  `);
  await restoreProjectDiff(proj);
}

/**
 * Try to re-render a project's diff from its saved file content.
 * Falls back to the "please reload the file" prompt if nothing was saved
 * (e.g. projects created before this feature, or a failed save due to quota).
 */
async function restoreProjectDiff(proj) {
  const savedText = loadFileContent(proj.id);
  if (savedText != null) {
    try {
      const parsed = parseDiff(savedText);
      if (parsed.length > 0) {
        await computeAllHashes(parsed);
        // If the user switched to a different project while hashing was in
        // flight, don't clobber whatever is now on screen with stale results.
        if (app.currentProjectId !== proj.id) return;
        app.parsedDiff = parsed;
        renderDiff();
        return;
      }
    } catch (e) {
      // Corrupted saved content or a hashing failure shouldn't leave the UI
      // stuck on the "読み込み中…" state; fall through to the reload prompt.
      console.error('Failed to restore saved diff content for project', proj.id, e);
    }
  }

  if (app.currentProjectId !== proj.id) return;
  app.parsedDiff = null;
  showEmptyState(`
    <span class="icon" aria-hidden="true">📂</span>
    プロジェクト「${esc(proj.fileName)}」を選択中<br>
    同じdiffファイルを再度読み込むと、レビュー済み状態が復元されます
  `);
}

/** Reset all review checkboxes for a project */
function resetProject(projectId) {
  const proj = loadProjects().find(p => p.id === projectId);
  if (!confirm(`プロジェクト「${proj ? proj.id : projectId}」のチェック状態をリセットしますか？`)) return;

  const allReviews = loadAllReviews();
  delete allReviews[projectId];
  saveAllReviews(allReviews);
  scheduleSettingsAutoSave();

  if (app.currentProjectId === projectId && app.parsedDiff) renderDiff();
  renderProjectList();
}

/** Permanently delete a project */
function deleteProject(projectId) {
  const proj = loadProjects().find(p => p.id === projectId);
  if (!confirm(`プロジェクト「${proj ? proj.id : projectId}」を削除しますか？\nチェック状態も合わせて削除されます。`)) return;

  const allReviews = loadAllReviews();
  delete allReviews[projectId];
  saveAllReviews(allReviews);
  deleteMemosForProject(projectId);
  deleteFileContent(projectId);
  deleteFileHandleRecord(projectId);

  saveProjects(loadProjects().filter(p => p.id !== projectId));
  scheduleSettingsAutoSave();

  if (app.currentProjectId === projectId) {
    app.currentProjectId = null;
    app.parsedDiff = null;
    localStorage.removeItem(SK_CURRENT);
    showEmptyState('<span class="icon" aria-hidden="true">📄</span>Diffファイルを読み込んでください');
  }
  refreshMemoUI();

  renderProjectList();
}

/**
 * Create a brand-new project and display its diff.
 * `encodingPref` is the user's encoding choice ('auto' or an explicit
 * override) persisted for future loads/reloads; `resolvedEncoding` is the
 * concrete encoding actually used to decode this file, shown in the UI.
 */
function createNewProject(fileName, parsed, rawText, fileHandle = null, encodingPref = 'auto', resolvedEncoding = 'utf-8') {
  const id  = generateProjectId(fileName);
  const now = Date.now();
  const projects = loadProjects();
  projects.push({ id, fileName, createdAt: now, lastUpdated: now, encoding: encodingPref, resolvedEncoding });
  saveProjects(projects);
  scheduleSettingsAutoSave();
  saveFileContent(id, rawText);
  if (fileHandle) saveFileHandle(id, fileHandle).then(renderProjectList);

  app.currentProjectId = id;
  app.parsedDiff = parsed;
  localStorage.setItem(SK_CURRENT, id);
  refreshMemoUI();

  renderProjectList();
  renderDiff();
}

/** Update an existing project's metadata and display its (new) diff */
function updateExistingProject(projectId, parsed, rawText, fileHandle = null, encodingPref = undefined, resolvedEncoding = undefined) {
  const projects = loadProjects();
  const proj = projects.find(p => p.id === projectId);
  if (proj) {
    proj.lastUpdated = Date.now();
    if (encodingPref !== undefined) proj.encoding = encodingPref;
    if (resolvedEncoding !== undefined) proj.resolvedEncoding = resolvedEncoding;
    saveProjects(projects);
    scheduleSettingsAutoSave();
  }
  saveFileContent(projectId, rawText);
  if (fileHandle) saveFileHandle(projectId, fileHandle).then(renderProjectList);

  app.currentProjectId = projectId;
  app.parsedDiff = parsed;
  localStorage.setItem(SK_CURRENT, projectId);
  refreshMemoUI();

  renderProjectList();
  renderDiff();
}

/**
 * Change a project's encoding preference and, if possible, immediately
 * re-decode its file with the new setting. Requires a remembered
 * FileSystemFileHandle (File System Access API); otherwise the preference
 * is saved and applied the next time the file is (re-)selected.
 */
async function changeProjectEncoding(projectId, newEncoding) {
  const projects = loadProjects();
  const proj = projects.find(p => p.id === projectId);
  if (!proj) return;
  proj.encoding = newEncoding;
  saveProjects(projects);

  if (projectIdsWithHandles.has(projectId)) {
    await reloadProjectFile(projectId);
  } else {
    renderProjectList();
    alert(
      '文字コードの設定を保存しました。\n' +
      '「📂 Diffファイルを開く」から同じファイルを選び直すと、新しい設定で再読み込みされます。'
    );
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Export / Import
// ─────────────────────────────────────────────────────────────────────────────

/** Keep only well-formed project entries; drop anything with an unexpected shape. */
function sanitizeImportedProjects(rawProjects) {
  if (!Array.isArray(rawProjects)) return [];
  const result = [];
  for (const p of rawProjects) {
    if (!p || typeof p !== 'object') continue;
    if (typeof p.id !== 'string' || typeof p.fileName !== 'string') continue;
    const createdAt = typeof p.createdAt === 'number' ? p.createdAt : Date.now();
    const lastUpdated = typeof p.lastUpdated === 'number' ? p.lastUpdated : createdAt;
    const encoding = normalizeEncoding(p.encoding);
    const resolvedEncoding = ['utf-8', 'shift_jis', 'euc-jp'].includes(p.resolvedEncoding) ? p.resolvedEncoding : undefined;
    result.push({ id: p.id, fileName: p.fileName, createdAt, lastUpdated, encoding, resolvedEncoding });
  }
  return result;
}

/**
 * Build the app-data payload shared by manual export and folder-based settings save.
 * schemaVersion 2 (issue #51): `reviews` hunk values changed from a boolean
 * to a status string (see REVIEW_STATUSES). schemaVersion 3 (issue #58):
 * added `keywordCategories` (the SK_KEYWORDS category/color list). Imports
 * are version-agnostic — sanitizeReviewsData()/normalizeReviewStatus() coerce
 * both the old boolean shape and the new string shape on read, and
 * `keywordCategories` is simply absent from pre-#58 exports — so
 * schemaVersion is informational only and isn't itself checked on import.
 */
function buildExportData() {
  return {
    schemaVersion: 3,
    exportedAt: new Date().toISOString(),
    projects: loadProjects(),
    reviews: loadAllReviews(),
    memos: loadAllMemos(),
    keywordCategories: loadKeywordCategories(),
  };
}

/**
 * Merge imported keyword categories (issue #58) into localStorage: same-ID
 * categories are overwritten, other existing categories are kept — same
 * merge policy as projects in mergeImportedData(). `raw` is absent on
 * pre-#58 exports, in which case this is a no-op.
 */
function mergeImportedKeywordCategories(raw) {
  const importedCategories = sanitizeKeywordCategories(raw);
  if (importedCategories.length === 0) return;

  const byId = new Map(loadKeywordCategories().map(c => [c.id, c]));
  for (const c of importedCategories) byId.set(c.id, c);
  saveKeywordCategories([...byId.values()]);
}

/**
 * Merge parsed app-data (projects + reviews + keyword categories) into
 * localStorage: same-ID projects/categories are overwritten, other existing
 * ones are kept. Shared by importAppData() and the settings-folder load flow.
 * @returns {number} number of projects merged in
 */
function mergeImportedData(data) {
  const importedProjects = sanitizeImportedProjects(data.projects);
  const importedReviews  = sanitizeReviewsData(data.reviews);
  const importedMemos    = sanitizeMemosData(data.memos);
  // Independent of projects, so merge it even when there's nothing else to import
  // (e.g. an auto-saved settings file written before any project was loaded).
  mergeImportedKeywordCategories(data.keywordCategories);
  if (importedProjects.length === 0) return 0;

  const byId = new Map(loadProjects().map(p => [p.id, p]));
  for (const p of importedProjects) byId.set(p.id, p);
  saveProjects([...byId.values()]);

  const reviews = loadAllReviews();
  for (const pid of Object.keys(importedReviews)) {
    reviews[pid] = importedReviews[pid];
  }
  saveAllReviews(reviews);

  const memos = loadAllMemos();
  for (const pid of Object.keys(importedMemos)) {
    memos[pid] = importedMemos[pid];
  }
  saveAllMemos(memos);

  return importedProjects.length;
}

/** Download all projects + review state as a single JSON file. */
function exportAppData() {
  const data = buildExportData();

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');

  const a = document.createElement('a');
  a.href = url;
  a.download = `git-local-review-export_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/** Restore projects + review state from a previously exported JSON file. */
async function importAppData(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (err) {
    alert(`インポートファイルの読み込みに失敗しました:\n${err.message}`);
    return;
  }

  if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) {
    alert('インポートファイルの形式が正しくありません。');
    return;
  }

  const importedCount = sanitizeImportedProjects(data.projects).length;
  if (importedCount === 0) {
    alert('インポート可能なプロジェクトが見つかりませんでした。');
    return;
  }

  if (!confirm(
    `${importedCount} 件のプロジェクトをインポートします。\n` +
    `同じIDの既存プロジェクトは上書きされます。よろしいですか？`
  )) return;

  mergeImportedData(data);
  renderProjectList();
  refreshMemoUI();
  alert(`${importedCount} 件のプロジェクトをインポートしました。`);
}

// ─────────────────────────────────────────────────────────────────────────────
// Settings folder — save/auto-load projects + review state to/from a
// user-chosen local folder (File System Access API), independent of the
// manual export/import flow above.
// ─────────────────────────────────────────────────────────────────────────────

/** Refresh the settings-folder name shown in the sidebar. */
async function refreshSettingsFolderUI() {
  const nameEl = document.getElementById('settings-folder-name');
  if (!nameEl) return;
  const handle = await loadFolderHandle(FOLDER_KEY_SETTINGS);
  nameEl.textContent = handle ? handle.name : '未設定';
  nameEl.title = handle ? handle.name : '';

  // Proactively surface the auto-save warning (issue #60) as soon as we know
  // a folder is configured but write permission isn't currently granted —
  // rather than waiting for the next debounced auto-save attempt to notice.
  if (!handle) {
    hideAutoSaveWarning();
  } else if (!(await verifyHandlePermission(handle, 'readwrite', /* requestIfNeeded */ false))) {
    showAutoSaveWarning('保存先フォルダへの書き込みアクセスが許可されていません。自動保存は実行されません。');
  } else {
    hideAutoSaveWarning();
  }
}

/** mtime (ms) of the settings file in `dirHandle`, or null if it doesn't exist. */
async function statSettingsFile(dirHandle) {
  try {
    const fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME);
    const file = await fileHandle.getFile();
    return file.lastModified;
  } catch (err) {
    if (err.name !== 'NotFoundError') console.error('Failed to stat settings file', err);
    return null;
  }
}

function showSettingsExternalUpdateNotice() {
  const el = document.getElementById('settings-external-update-notice');
  if (el) el.style.display = '';
}

function hideSettingsExternalUpdateNotice() {
  const el = document.getElementById('settings-external-update-notice');
  if (el) el.style.display = 'none';
}

/**
 * Top-of-page warning (issue #60), shown only while a settings auto-save
 * folder is configured AND auto-save isn't actually able to run — write
 * permission was lost/never granted, or the last write attempt threw. It is
 * deliberately separate from showSettingsExternalUpdateNotice() above: an
 * externally-changed file is an intentional, already-explained skip (its own
 * sidebar notice tells the user why and offers a "読み込む" action), not a
 * failure to warn about here.
 */
function showAutoSaveWarning(message) {
  const banner = document.getElementById('autosave-warning-banner');
  const textEl = document.getElementById('autosave-warning-text');
  if (textEl) {
    textEl.textContent = message;
    // The text is truncated with an ellipsis on narrow viewports/long
    // messages (e.g. an error's message text) — title exposes the full text.
    textEl.title = message;
  }
  if (banner) banner.style.display = 'flex';
  document.documentElement.style.setProperty('--autosave-warning-height', `${AUTOSAVE_WARNING_HEIGHT_PX}px`);
}

function hideAutoSaveWarning() {
  const banner = document.getElementById('autosave-warning-banner');
  if (banner) banner.style.display = 'none';
  document.documentElement.style.setProperty('--autosave-warning-height', '0px');
}

/** Write current projects + review state to the settings file in the chosen folder. */
async function saveSettingsToFolder() {
  const statusEl = document.getElementById('settings-save-status');
  const dirHandle = await loadFolderHandle(FOLDER_KEY_SETTINGS);
  if (!dirHandle) {
    alert('先に設定の保存先フォルダを選択してください。');
    return;
  }

  if (!(await verifyHandlePermission(dirHandle, 'readwrite'))) {
    alert('フォルダへの書き込みアクセスが許可されませんでした。');
    return;
  }

  clearTimeout(settingsAutoSaveTimer);
  settingsAutoSaveTimer = null;

  try {
    const fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(buildExportData(), null, 2));
    await writable.close();
    settingsFileKnownModified = (await fileHandle.getFile()).lastModified;
    hideSettingsExternalUpdateNotice();
    hideAutoSaveWarning();
    if (statusEl) {
      const stamp = new Date().toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
      statusEl.textContent = `${stamp} に保存しました`;
    }
  } catch (err) {
    console.error('Failed to save settings to folder', err);
    alert(`設定の保存に失敗しました:\n${err.message}`);
    // A manual save uses the same write path auto-save does, so a failure
    // here means auto-save would fail the same way — keep the top warning
    // up as a persistent reminder beyond this one-time alert.
    showAutoSaveWarning(`保存先フォルダへの自動保存に失敗しています（${err.message}）。`);
  }
}

/**
 * Debounced auto-save, called after a project/review change. Waits for a
 * quiet moment so rapid successive changes (e.g. toggling many checkboxes)
 * result in one write rather than one per change.
 */
function scheduleSettingsAutoSave() {
  if (!supportsFileSystemAccess) return;
  clearTimeout(settingsAutoSaveTimer);
  settingsAutoSaveTimer = setTimeout(() => {
    settingsAutoSaveTimer = null;
    autoSaveSettingsToFolder();
  }, SETTINGS_AUTO_SAVE_DEBOUNCE_MS);
}

/**
 * Silently write current state to the settings folder, if one is configured
 * and write permission is already granted (no user gesture is available
 * here, so a not-yet-granted permission is skipped rather than prompted
 * for). Bails out without writing if the on-disk file changed since we last
 * saved/loaded it — that means another environment wrote data we haven't
 * seen yet, and auto-saving would silently discard it.
 */
async function autoSaveSettingsToFolder() {
  const dirHandle = await loadFolderHandle(FOLDER_KEY_SETTINGS);
  if (!dirHandle) return;
  if (!(await verifyHandlePermission(dirHandle, 'readwrite', /* requestIfNeeded */ false))) {
    showAutoSaveWarning('保存先フォルダへの書き込みアクセスが許可されていません。自動保存は実行されません。');
    return;
  }

  const currentModified = await statSettingsFile(dirHandle);
  if (currentModified !== settingsFileKnownModified) {
    // Covers both "changed since we last saw it" and "we've never seen it
    // but it now exists" (e.g. another environment created it first). This
    // is an intentional, already-explained skip (see showSettingsExternalUpdateNotice()),
    // not a failure, so it doesn't trigger showAutoSaveWarning().
    showSettingsExternalUpdateNotice();
    return;
  }

  try {
    const fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(buildExportData(), null, 2));
    await writable.close();
    settingsFileKnownModified = (await fileHandle.getFile()).lastModified;
    hideSettingsExternalUpdateNotice();
    hideAutoSaveWarning();
    const statusEl = document.getElementById('settings-save-status');
    if (statusEl) {
      const stamp = new Date().toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
      statusEl.textContent = `${stamp} に自動保存しました`;
    }
  } catch (err) {
    console.error('Failed to auto-save settings to folder', err);
    showAutoSaveWarning(`保存先フォルダへの自動保存に失敗しています（${err.message}）。`);
  }
}

/**
 * Poll the settings file so edits made from another browser/environment are
 * noticed even without a local change triggering autoSaveSettingsToFolder.
 * Only ever shows a notice — never loads automatically.
 */
async function checkSettingsFileExternalChange() {
  const dirHandle = await loadFolderHandle(FOLDER_KEY_SETTINGS);
  if (!dirHandle) return;
  if (!(await verifyHandlePermission(dirHandle, 'read', /* requestIfNeeded */ false))) return;

  const currentModified = await statSettingsFile(dirHandle);
  if (currentModified === null) return;
  if (currentModified !== settingsFileKnownModified) {
    showSettingsExternalUpdateNotice();
  }
}

function startSettingsExternalChangeWatcher() {
  clearInterval(settingsExternalCheckTimer);
  settingsExternalCheckTimer = setInterval(checkSettingsFileExternalChange, SETTINGS_EXTERNAL_CHECK_INTERVAL_MS);
}

/**
 * If the chosen settings folder already contains a settings file, offer to
 * load it right away. Called right after the user picks a folder, so
 * permission is already granted from that same gesture.
 */
async function maybeLoadExistingSettingsAfterFolderPick(dirHandle) {
  let fileHandle;
  try {
    fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME);
  } catch (err) {
    return; // no existing settings file in this folder
  }

  try {
    const file = await fileHandle.getFile();
    settingsFileKnownModified = file.lastModified;
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) return;
    if (!confirm('選択したフォルダに既存の設定ファイルが見つかりました。読み込みますか？')) return;
    const count = mergeImportedData(data);
    hideSettingsExternalUpdateNotice();
    renderProjectList();
    alert(`${count} 件のプロジェクトを読み込みました。`);
  } catch (err) {
    console.error('Failed to load existing settings file', err);
  }
}

/**
 * On page load, silently restore projects + review state from the settings
 * folder if one is configured and permission is already granted (no user
 * gesture is available yet, so a not-yet-granted permission is skipped
 * rather than prompted for).
 */
async function loadSettingsFromFolderOnStartup() {
  const dirHandle = await loadFolderHandle(FOLDER_KEY_SETTINGS);
  if (!dirHandle) return;
  if (!(await verifyHandlePermission(dirHandle, 'read', /* requestIfNeeded */ false))) return;

  let fileHandle;
  try {
    fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME);
  } catch (err) {
    if (err.name !== 'NotFoundError') console.error('Failed to look up settings file', err);
    return;
  }

  try {
    const file = await fileHandle.getFile();
    settingsFileKnownModified = file.lastModified;
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) return;
    mergeImportedData(data);
  } catch (err) {
    console.error('Failed to load settings from folder', err);
  }
}

/**
 * Manually reload from the settings folder on demand — the counterpart to
 * the auto-save skip/notice in autoSaveSettingsToFolder(): loading itself
 * always stays an explicit user action, never automatic.
 */
async function reloadSettingsFromFolderManually() {
  const dirHandle = await loadFolderHandle(FOLDER_KEY_SETTINGS);
  if (!dirHandle) return;

  if (!(await verifyHandlePermission(dirHandle, 'read'))) {
    alert('フォルダへの読み取りアクセスが許可されませんでした。');
    return;
  }

  let fileHandle;
  try {
    fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME);
  } catch (err) {
    // Nothing to load; reset the baseline so a future auto-save is free to
    // create the file, instead of being skipped forever as "conflicting".
    settingsFileKnownModified = null;
    hideSettingsExternalUpdateNotice();
    alert('保存先フォルダに設定ファイルが見つかりませんでした。');
    return;
  }

  try {
    const file = await fileHandle.getFile();
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) {
      alert('設定ファイルの形式が正しくありません。');
      return;
    }
    const count = mergeImportedData(data);
    settingsFileKnownModified = file.lastModified;
    hideSettingsExternalUpdateNotice();
    renderProjectList();
    if (app.currentProjectId && app.parsedDiff) renderDiff();
    refreshMemoUI();
    alert(`${count} 件のプロジェクトを読み込みました。`);
  } catch (err) {
    console.error('Failed to reload settings from folder', err);
    alert(`設定の読み込みに失敗しました:\n${err.message}`);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Conflict modal (same filename detected)
// ─────────────────────────────────────────────────────────────────────────────
function showConflictModal(fileName, existingProjects, parsed, rawText, fileHandle = null, encodingPref = 'auto', resolvedEncoding = 'utf-8') {
  modalFileName   = fileName;
  modalParsedDiff = parsed;
  modalRawText    = rawText;
  modalFileHandle = fileHandle;
  modalEncoding   = encodingPref;
  modalResolvedEncoding = resolvedEncoding;

  document.getElementById('modal-desc').textContent =
    `ファイル名「${fileName}」の既存プロジェクトが ${existingProjects.length} 件あります。` +
    `更新するプロジェクトを選択するか、新規プロジェクトとして作成してください。`;

  const listEl = document.getElementById('modal-proj-list');
  listEl.innerHTML = '';

  // Pre-select the most recently updated project
  const sorted = [...existingProjects].sort((a, b) => (b.lastUpdated || b.createdAt) - (a.lastUpdated || a.createdAt));
  modalSelectedId = sorted[0]?.id ?? null;

  for (const proj of sorted) {
    const div = document.createElement('div');
    div.className = 'proj-option' + (proj.id === modalSelectedId ? ' selected' : '');
    div.tabIndex = 0;

    const updated = new Date(proj.lastUpdated || proj.createdAt).toLocaleString('ja-JP', {
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    });

    const idEl   = document.createElement('div'); idEl.className = 'opt-id';   idEl.textContent = proj.id;
    const metaEl = document.createElement('div'); metaEl.className = 'opt-meta'; metaEl.textContent = `更新: ${updated}`;
    div.appendChild(idEl);
    div.appendChild(metaEl);

    div.addEventListener('click', () => {
      listEl.querySelectorAll('.proj-option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      modalSelectedId = proj.id;
    });

    div.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        div.click();
      }
    });

    listEl.appendChild(div);
  }

  document.getElementById('modal-overlay').classList.add('active');

  // Focus on the primary button for keyboard/screen-reader accessibility.
  // Timeout ensures the modal is fully rendered before focusing.
  setTimeout(() => {
    document.getElementById('modal-btn-update').focus();
  }, 100);

  // Resolved once the user makes a choice (or dismisses the modal), so
  // callers such as loadDiffFile() can await the outcome before moving on
  // to the next file in a batch.
  return new Promise((resolve) => {
    modalResolve = resolve;
  });
}

/** Settle the pending showConflictModal() promise, if any, then clear it. */
function resolvePendingModal() {
  if (modalResolve) {
    const resolve = modalResolve;
    modalResolve = null;
    resolve();
  }
}

function hideModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  modalFileName   = '';
  modalParsedDiff = null;
  modalRawText    = null;
  modalSelectedId = null;
  modalFileHandle = null;
  modalEncoding   = 'auto';
  modalResolvedEncoding = 'utf-8';
}

// ─────────────────────────────────────────────────────────────────────────────
// File loading
// ─────────────────────────────────────────────────────────────────────────────
/**
 * Load and parse a single diff File, then either create a new project or
 * (when a same-named project already exists) resolve the conflict.
 *
 * In normal (interactive) mode a conflict opens the confirmation modal and
 * waits for the user's choice. In batch mode (used when multiple files are
 * uploaded at once) the modal is skipped and a new project is always
 * created automatically, so a whole batch can be processed without
 * blocking on per-file dialogs; the caller is told a conflict occurred so
 * it can summarize this for the user afterwards.
 *
 * @returns {Promise<{conflict: boolean}>}
 */
async function loadDiffFile(file, fileHandle = null, encodingPref = 'auto', { batchMode = false } = {}) {
  let buffer;
  try {
    buffer = await file.arrayBuffer();
  } catch (err) {
    alert(`ファイルの読み込みに失敗しました:\n${err.message}`);
    return { conflict: false };
  }

  const { text, encoding } = decodeBytes(buffer, encodingPref);

  const parsed = parseDiff(text);
  if (parsed.length === 0) {
    alert(
      `「${file.name}」: 有効なdiff（unified diff形式）が見つかりませんでした。\n` +
      'git diff または git show の出力を保存したファイルをご利用ください。\n' +
      '文字コードの判定・指定が誤っている可能性もあります。'
    );
    return { conflict: false };
  }

  // Compute SHA-256 hashes for all hunks (async, uses Web Crypto API)
  await computeAllHashes(parsed);

  const fileName = file.name;
  const existing = projectsByFileName(fileName);

  if (existing.length > 0) {
    if (batchMode) {
      // Don't block a multi-file upload on a per-file modal: always add as
      // a new project, and let the caller inform the user afterwards.
      createNewProject(fileName, parsed, text, fileHandle, encodingPref, encoding);
      return { conflict: true };
    }
    await showConflictModal(fileName, existing, parsed, text, fileHandle, encodingPref, encoding);
    return { conflict: true };
  }

  createNewProject(fileName, parsed, text, fileHandle, encodingPref, encoding);
  return { conflict: false };
}

/**
 * Load multiple diff files, one after another (never in parallel — project
 * IDs are generated from a same-day sequence counter, so concurrent loads
 * of same-named files could race and collide).
 *
 * A single file is delegated straight to loadDiffFile() in its normal
 * interactive mode, leaving that existing single-file flow (including the
 * conflict modal) completely untouched. For two or more files, conflicts
 * are auto-resolved (see loadDiffFile's batchMode) and summarized in one
 * alert at the end, so the user is always told what happened and no file
 * is silently dropped.
 */
async function loadDiffFiles(files, encodingPref = 'auto', fileHandles = null) {
  if (files.length === 0) return;

  if (files.length === 1) {
    await loadDiffFile(files[0], fileHandles ? fileHandles[0] : null, encodingPref);
    return;
  }

  const autoRenamed = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const handle = fileHandles ? fileHandles[i] : null;
    const result = await loadDiffFile(file, handle, encodingPref, { batchMode: true });
    if (result && result.conflict) autoRenamed.push(file.name);
  }

  renderProjectList();

  if (autoRenamed.length > 0) {
    alert(
      `${files.length} 件のファイルを読み込みました。\n` +
      `うち ${autoRenamed.length} 件は同名の既存プロジェクトがあったため、新規プロジェクトとして追加しました:\n` +
      autoRenamed.map(n => `・${n}`).join('\n')
    );
  } else {
    alert(`${files.length} 件のファイルをすべて新規プロジェクトとして読み込みました。`);
  }
}

/**
 * Re-read a project's remembered file straight from disk via its stored
 * FileSystemFileHandle (File System Access API) and refresh its diff/review
 * state in place, without going through the file picker again.
 */
async function reloadProjectFile(projectId) {
  const proj = loadProjects().find(p => p.id === projectId);
  if (!proj) return;

  const handle = await loadFileHandle(projectId);
  if (!handle) {
    alert(
      'このプロジェクトには再読み込み用のファイル参照が保存されていません。\n' +
      '「📂 Diffファイルを開く」から選び直してください。'
    );
    return;
  }

  try {
    let permission = await handle.queryPermission({ mode: 'read' });
    if (permission !== 'granted') {
      permission = await handle.requestPermission({ mode: 'read' });
    }
    if (permission !== 'granted') {
      alert(
        'ファイルへのアクセスが許可されなかったため、保存していたファイル参照を破棄しました。\n' +
        '「📂 Diffファイルを開く」から選び直してください。'
      );
      await deleteFileHandleRecord(projectId);
      renderProjectList();
      return;
    }

    const file = await handle.getFile();
    const buffer = await file.arrayBuffer();
    const { text, encoding } = decodeBytes(buffer, normalizeEncoding(proj.encoding));
    const parsed = parseDiff(text);
    if (parsed.length === 0) {
      alert(
        '有効なdiff（unified diff形式）が見つかりませんでした。\n' +
        'ファイルの内容を確認してください。\n' +
        '文字コードの判定・指定が誤っている可能性もあります。'
      );
      return;
    }
    await computeAllHashes(parsed);
    updateExistingProject(projectId, parsed, text, handle, proj.encoding, encoding);
  } catch (err) {
    console.error('Failed to reload file for project', projectId, err);
    alert(
      `ファイルの再読み込みに失敗しました:\n${err.message}\n\n` +
      'ファイルが移動または削除された可能性があります。「📂 Diffファイルを開く」から選び直してください。'
    );
    if (err.name === 'NotFoundError') {
      await deleteFileHandleRecord(projectId);
      renderProjectList();
    }
  }
}

  if (!supportsFileSystemAccess) {
    document.getElementById('file-input').click();
    return;
  }

  const pickerOptions = {
    types: [{
      description: 'Diff files',
      accept: { 'text/plain': ['.diff', '.patch', '.txt'] },
    }],
    excludeAcceptAllOption: false,
    multiple: true,
  };

  const openFolderHandle = await loadFolderHandle(FOLDER_KEY_OPEN);

  let handles;
  try {
    handles = await window.showOpenFilePicker(pickerOptions);

    if (err.name === 'AbortError') return;
    if (openFolderHandle) {
      // The remembered default folder may be stale (moved/deleted/revoked
      // permission); retry once without it rather than blocking file loading.
      delete pickerOptions.startIn;
      try {
        handles = await window.showOpenFilePicker(pickerOptions);

        if (err2.name !== 'AbortError') console.error('showOpenFilePicker failed', err2);
        return;
      }
    } else {
      console.error('showOpenFilePicker failed', err);
      return;
    }
  }

  const files = await Promise.all(handles.map(h => h.getFile()));
  await loadDiffFiles(files, encodingPref, handles);
});
