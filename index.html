// Close modal with ESC key for keyboard accessibility, and provide keyboard
// shortcuts for hunk navigation: j/k move focus between hunks, Space cycles
// the focused hunk's review status, and 1/2/3 set it directly (see
// REVIEW_STATUSES for the key-to-status mapping).
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
    hideModal();
    resolvePendingModal();
    return;
  }

  if (e.key === 'Escape' && isSettingsModalOpen()) {
    closeSettingsModal();
    return;
  }

  if (e.key === 'Escape' && !WIDE_LAYOUT_MEDIA_QUERY.matches && isMemoPanelOpen()) {
    closeMemoPanel();
    return;
  }

  // Don't hijack keys while the user is typing into a form field, while the
  // file-conflict or settings modal is open, or while focus is inside the
  // memo panel (its close/delete buttons can hold focus without being an
  // INPUT, which would otherwise let j/k/Space leak through to hunk
  // navigation behind it). Checking focus rather than isMemoPanelOpen()
  // matters once the panel is permanently docked open on wide viewports —
  // j/k/Space must still work for hunk navigation whenever focus isn't
  // actually inside the panel.
  const tag = e.target && e.target.tagName;
  const isTyping = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
  const focusInMemoPanel = document.getElementById('memo-panel').contains(e.target);
  if (isTyping || modalOverlay.classList.contains('active') || isSettingsModalOpen() || focusInMemoPanel) return;

  if (e.key === 'j') {
    e.preventDefault();
    moveHunkFocus(1);
  } else if (e.key === 'k') {
    e.preventDefault();
    moveHunkFocus(-1);
  } else if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return; // ignore key-repeat from holding Space down
    cycleFocusedHunkStatus();
  } else {
    const statusForKey = REVIEW_STATUSES.find(s => s.key === e.key);
    if (statusForKey) {
      e.preventDefault();
      if (e.repeat) return;
      setFocusedHunkStatus(statusForKey.value);
    }
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// Drag & drop file upload — dropping one or more diff files anywhere on the
// window loads them the same way as picking them via "📂 Diffファイルを開く"
// (including the same-filename conflict modal and batch-upload summary).
// ─────────────────────────────────────────────────────────────────────────────
function dragEventHasFiles(e) {
  return !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'));
}

/**
 * Extract File objects from a drop event's DataTransfer, and — where the
 * browser supports it (Chromium) — the matching FileSystemFileHandles too,
 * so dropped files get the same "🔃 再読み込み" support as files opened via
 * the file picker. Falls back to plain File objects (no handles) elsewhere.
 */
async function filesFromDataTransfer(dataTransfer) {
  const items = dataTransfer.items;
  if (supportsFileSystemAccess && items && items.length && typeof items[0].getAsFileSystemHandle === 'function') {
    const fileItems = Array.from(items).filter(item => item.kind === 'file');
    const files = [];
    const handles = [];
    for (const item of fileItems) {
      try {
        const handle = await item.getAsFileSystemHandle();
        if (!handle || handle.kind !== 'file') continue; // skip dropped folders
        handles.push(handle);
        files.push(await handle.getFile());
      } catch (err) {
        console.error('getAsFileSystemHandle failed for dropped item', err);
      }
    }
    if (files.length > 0) return { files, handles };
  }
  return { files: Array.from(dataTransfer.files), handles: null };
}

let dragCounter = 0;
const dropOverlay = document.getElementById('drop-overlay');

window.addEventListener('dragenter', (e) => {
  if (!dragEventHasFiles(e)) return;
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add('active');
});

window.addEventListener('dragover', (e) => {
  // preventDefault() is required here too — without it the browser rejects the drop.
  if (dragEventHasFiles(e)) e.preventDefault();
});

window.addEventListener('dragleave', (e) => {
  if (!dragEventHasFiles(e)) return;
  dragCounter = Math.max(0, dragCounter - 1);
  if (dragCounter === 0) dropOverlay.classList.remove('active');
});

window.addEventListener('drop', async (e) => {
  if (!dragEventHasFiles(e)) return;
  e.preventDefault(); // without this the browser navigates to the dropped file
  dragCounter = 0;
  dropOverlay.classList.remove('active');

  // Avoid stacking a new load on top of an already-open conflict or settings modal.
  if (modalOverlay.classList.contains('active') || isSettingsModalOpen()) return;

  const { files, handles } = await filesFromDataTransfer(e.dataTransfer);
  if (files.length === 0) return;

  const encodingPref = document.getElementById('encoding-select').value;
  await loadDiffFiles(files, encodingPref, handles);
});

// ─────────────────────────────────────────────────────────────────────────────
// Keyword categories (issue #10, #50): each category row lets the user edit
// its keyword list and background color; persists across reloads/projects
// and re-renders the currently displayed diff (debounced) whenever a
// category's content changes. Adding/removing a category rebuilds the row
// list immediately (no debounce needed, and no in-progress input to lose
// focus on).
// ─────────────────────────────────────────────────────────────────────────────
/** Count badge text for a category row: empty unless counting is on and a diff is loaded. */
function keywordCategoryCountBadgeText(category) {
  if (!category.countEnabled || !app.parsedDiff) return '';
  return `${countKeywordMatches(parseKeywords(category.keywords))}件`;
}

function buildKeywordCategoryRow(category) {
  const row = document.createElement('div');
  row.className = 'keyword-category-row';

  const main = document.createElement('div');
  main.className = 'keyword-category-main';

  const colorInput = document.createElement('input');
  colorInput.type = 'color';
  colorInput.className = 'keyword-category-color';
  colorInput.value = category.color;
  colorInput.title = '背景色';
  colorInput.setAttribute('aria-label', '背景色');
  colorInput.addEventListener('input', () => {
    updateKeywordCategory(category.id, { color: colorInput.value });
  });

  const keywordsInput = document.createElement('input');
  keywordsInput.type = 'text';
  keywordsInput.className = 'keyword-category-keywords';
  keywordsInput.value = category.keywords;
  keywordsInput.placeholder = '例: TODO, FIXME, XXX';
  keywordsInput.title = 'カンマ区切りで複数指定できます（大文字小文字は区別しません）';
  keywordsInput.setAttribute('aria-label', 'キーワード（カンマ区切り）');
  keywordsInput.addEventListener('input', () => {
    updateKeywordCategory(category.id, { keywords: keywordsInput.value });
  });

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'keyword-category-remove-btn';
  removeBtn.title = 'このカテゴリを削除';
  removeBtn.setAttribute('aria-label', 'カテゴリを削除');
  removeBtn.textContent = '×';
  removeBtn.addEventListener('click', () => deleteKeywordCategory(category.id));

  main.appendChild(colorInput);
  main.appendChild(keywordsInput);
  main.appendChild(removeBtn);

  // Count toggle (issue #59): per-category opt-in match counter across the
  // whole loaded diff, e.g. "TODO はカウントする、NOTE はカウントしない".
  const countRow = document.createElement('label');
  countRow.className = 'keyword-category-count-row';
  countRow.title = '登録したキーワードが全差分内で一致した回数をカウントします';

  const countToggle = document.createElement('input');
  countToggle.type = 'checkbox';
  countToggle.className = 'keyword-category-count-toggle';
  countToggle.checked = !!category.countEnabled;
  countToggle.setAttribute('aria-label', 'このカテゴリの一致回数をカウントする');

  const countBadge = document.createElement('span');
  countBadge.className = 'keyword-category-count-badge';
  countBadge.dataset.categoryId = category.id;
  countBadge.textContent = keywordCategoryCountBadgeText(category);

  countToggle.addEventListener('change', () => {
    updateKeywordCategory(category.id, { countEnabled: countToggle.checked });
    // Use keywordsInput.value (not category.keywords, which is a snapshot from
    // when this row was built) so a keyword edited just before toggling counts
    // with the current text rather than briefly showing a stale count.
    countBadge.textContent = keywordCategoryCountBadgeText({ keywords: keywordsInput.value, countEnabled: countToggle.checked });
  });

  countRow.appendChild(countToggle);
  countRow.appendChild(document.createTextNode('カウント'));
  countRow.appendChild(countBadge);

  row.appendChild(main);
  row.appendChild(countRow);
  return row;
}

function renderKeywordCategoryList() {
  const container = document.getElementById('keyword-categories');
  container.innerHTML = '';
  const categories = loadKeywordCategories();
  if (categories.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'keyword-categories-empty';
    empty.textContent = 'カテゴリがありません。「+ カテゴリ」から追加してください。';
    container.appendChild(empty);
    return;
  }
  for (const category of categories) {
    container.appendChild(buildKeywordCategoryRow(category));
  }
}

/**
 * Recomputes and updates every rendered category's count badge in place
 * (without rebuilding the rows/losing focus). Called after renderDiff() so
 * counts stay in sync whenever the loaded diff changes.
 */
function refreshKeywordCounts() {
  // Match badges by dataset.categoryId in JS rather than interpolating
  // category.id into a querySelector() string — ids can come from imported
  // JSON (sanitizeKeywordCategories() accepts any non-empty string), and one
  // containing '"' or ']' would otherwise throw a DOMException.
  const badgesById = new Map();
  for (const el of document.querySelectorAll('.keyword-category-count-badge')) {
    badgesById.set(el.dataset.categoryId, el);
  }
  for (const category of loadKeywordCategories()) {
    const badge = badgesById.get(category.id);
    if (badge) badge.textContent = keywordCategoryCountBadgeText(category);
  }
}

function addKeywordCategory() {
  const categories = loadKeywordCategories();
  const color = KEYWORD_CATEGORY_COLOR_PALETTE[categories.length % KEYWORD_CATEGORY_COLOR_PALETTE.length];
  categories.push({ id: generateKeywordCategoryId(), keywords: '', color, countEnabled: false });
  saveKeywordCategories(categories);
  renderKeywordCategoryList();
}

let keywordDebounceTimer = null;
function scheduleKeywordDiffRerender() {
  clearTimeout(keywordDebounceTimer);
  keywordDebounceTimer = setTimeout(() => {
    if (app.parsedDiff) renderDiff();
  }, 200);
}

/** Updates a single category's fields in place without rebuilding the row list, so the input being edited keeps focus. */
function updateKeywordCategory(id, patch) {
  const categories = loadKeywordCategories();
  const category = categories.find(c => c.id === id);
  if (!category) return;
  Object.assign(category, patch);
  saveKeywordCategories(categories);
  scheduleKeywordDiffRerender();
}

function deleteKeywordCategory(id) {
  const categories = loadKeywordCategories().filter(c => c.id !== id);
  saveKeywordCategories(categories);
  renderKeywordCategoryList();
  scheduleKeywordDiffRerender();
}

renderKeywordCategoryList();
document.getElementById('keyword-category-add-btn').addEventListener('click', addKeywordCategory);

// ─────────────────────────────────────────────────────────────────────────────
// Initialise
// ─────────────────────────────────────────────────────────────────────────────
(async function init() {
  app.viewMode = loadViewMode();
  updateViewModeButtons();

  for (const key of REVIEW_FILTER_KEYS) {
    const checkbox = document.getElementById(`review-filter-${key}`);
    checkbox.checked = !!app.reviewFilter[key];
    checkbox.addEventListener('change', () => {
      app.reviewFilter[key] = checkbox.checked;
      saveReviewFilter(app.reviewFilter);
      renderDiff();
    });
  }

  document.getElementById('project-sort-select').value = loadProjectSort();
  await refreshHandleIndex();

  if (supportsFileSystemAccess) {
    await refreshOpenFolderUI();
    await refreshSettingsFolderUI();
    await loadSettingsFromFolderOnStartup();
    startSettingsExternalChangeWatcher();
  } else {
    document.getElementById('open-folder-row').style.display = 'none';
    document.getElementById('settings-save-section').style.display = 'none';
  }

  renderProjectList();

  // Restore the last active project selection, and its diff if a copy of the
  // last uploaded file was saved for it.
  const lastId = localStorage.getItem(SK_CURRENT);
  if (lastId) {
    const proj = loadProjects().find(p => p.id === lastId);
    if (proj) {
      app.currentProjectId = lastId;
      renderProjectList();
      await restoreProjectDiff(proj);
    }
  } else {
    showEmptyState('<span class="icon" aria-hidden="true">📄</span>Diffファイルを読み込んでください');
  }
  refreshMemoUI();
})();
</script>
